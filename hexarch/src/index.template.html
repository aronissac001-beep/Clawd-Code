<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hexarch">
<meta name="theme-color" content="#0b1016">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" id="touchicon" href="data:,">
<title>Hexarch</title>
<style>
/*@@CSS@@*/
</style>
</head>
<body>
<div id="app">
  <canvas id="map" aria-label="World map"></canvas>
  <div id="hud" hidden>
    <div id="top">
      <button id="btnMenu" class="icon" aria-label="Menu">☰</button>
      <button id="stGold" class="stat" aria-label="Gold"></button>
      <button id="stSci" class="stat grow" aria-label="Research"></button>
      <button id="stHap" class="stat" aria-label="Happiness"></button>
      <div id="turnInfo"></div>
    </div>
    <div id="mapBtns">
      <button id="btnWorld" class="fab" aria-label="World map">🗺️</button>
      <button id="btnLens" class="fab" aria-label="Yields lens">👁️</button>
      <button id="btnPolicy" class="fab" aria-label="Policies">🎭<span class="pip" hidden></span></button>
    </div>
    <div id="toasts"></div>
    <div id="turnBanner" hidden></div>
    <div id="busy" hidden>Rivals are taking their turns…</div>
    <div id="bottom">
      <div id="sel" hidden></div>
      <div id="turnbar">
        <button id="btnNext" class="wide">Next unit</button>
        <button id="btnEnd" class="pri wide">End turn</button>
      </div>
    </div>
  </div>
  <div id="screens"></div>
  <div id="modal"></div>
</div>
<script id="engine">
/*@@ENGINE@@*/
</script>
<script id="ui">
/*@@UI@@*/
</script>
</body>
</html>
