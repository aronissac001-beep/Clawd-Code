<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zonefall eye level</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none; }
  canvas { display: block; }
  #hud { position: fixed; left: 8px; top: 6px; font: 11px/1.35 monospace; color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
  #ui { position: fixed; right: 6px; top: 6px; display: flex; flex-wrap: wrap; gap: 3px; max-width: 62vw; justify-content: flex-end; }
  #ui button, #ui label { font: 10px monospace; background: rgba(0,0,0,.45); color: #fff; border: 1px solid #fff3; border-radius: 3px; padding: 2px 5px; }
  #ui input { width: 90px; vertical-align: middle; }
  body.clean #hud, body.clean #ui { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="ui"></div>
<script type="module">
// Eye-level test bench: real generated island + terrain + vegetation + Sky + Grass + Water,
// rendered with the game's Renderer from a first-person camera.
//   ?view=beach_noon|forest|grassland|dusk|dawn|night|night_sea|overcast|afternoon   &seed=1234  &clean=1 (no HUD)
//   ?x=&z=&yaw=&pitch=&t=&w=   free placement.  Drag = look, WASD = walk (Shift = sprint), [ ] = time, O = weather
//   Renders through the game's Renderer.render() (offscreen target + InkPass); ?ink=0 straight to screen, ?gdepth=1 grass writes depth
import { THREE } from '../src/gfx/materials.js';
import { generateWorld, B, WORLD } from '../src/world/gen.js';
import { buildTerrain } from '../src/gfx/terrain.js';
import { Renderer } from '../src/gfx/renderer.js';
import { VegLayer, setVegModels } from '../src/gfx/veg.js';
import * as MW from '../src/gfx/models_world.js';
import { Sky } from '../src/gfx/sky.js';
import { Grass } from '../src/gfx/grass.js';
import { makeWater } from '../src/gfx/water.js';

const q = new URLSearchParams(location.search);
if (q.get('clean')) document.body.classList.add('clean');
const DEG = Math.PI / 180;
const t0 = performance.now();
const W = generateWorld(+(q.get('seed') || 1234));
const tGen = performance.now() - t0;
setVegModels(MW);
const R = new Renderer(document.getElementById('c'), q.get('gfx') || 'high');
R.r.info.autoReset = false;
const scene = R.scene;
const T = buildTerrain(W); scene.add(T.group); T.sea.visible = false;
const V = new VegLayer(W); scene.add(V.group);
const sky = new Sky(scene); R.sky = sky;
const t1 = performance.now();
const grass = new Grass(scene, W);
const water = makeWater(WORLD * 4, W); water.mesh.position.set(WORLD / 2, -0.05, WORLD / 2); scene.add(water.mesh);
const tMods = performance.now() - t1;
window.W = W; window.R = R; window.sky = sky; window.grass = grass; window.water = water;

// ------------------------------------------------------------------ render path
// Default: the game's own Renderer.render() (offscreen target + InkPass when renderer.js has it).
//   ?ink=0      draw straight to the screen (no ink pass)
//   ?gdepth=1   grass writes depth (shows why it is off by default: the ink pass scribbles every blade)
if (q.get('ink') === '0') R.inkOn = false;
if (q.get('gdepth') === '1') { for (const m of grass.materials) m.depthWrite = true; for (const m of grass.meshes) m.renderOrder = 0; }
function renderScene() { R.render(); }
window.renderScene = renderScene;

// ------------------------------------------------------------------ spot finding
const cx0 = WORLD / 2, cz0 = WORLD / 2;
function biomeFrac(x, z, b, r = 30, step = 6) { let n = 0, k = 0; for (let dz = -r; dz <= r; dz += step) for (let dx = -r; dx <= r; dx += step) { if (dx * dx + dz * dz > r * r) continue; k++; if (W.biomeAt(x + dx, z + dz) === b) n++; } return n / k; }
function treesNear(x, z, r) { let n = 0; for (const v of W.veg) if ((v.kind === 'pine' || v.kind === 'oak' || v.kind === 'birch' || v.kind === 'palm') && (v.x - x) ** 2 + (v.z - z) ** 2 < r * r) n++; return n; }
function nearMon(x, z, pad) { return W.monuments.some(m => Math.hypot(m.x - x, m.z - z) < m.size + pad); }
function bestSpot(score) { let best = null, bs = -1e9; for (let z = 60; z < WORLD - 60; z += 14) for (let x = 60; x < WORLD - 60; x += 14) { if (nearMon(x, z, 20) || roadNear(x, z, 16)) continue; const s = score(x, z); if (s > bs) { bs = s; best = [x, z]; } } return best; }
/** beach spot on the coast facing direction `yaw` (looking out to sea): first ocean cell along the ray, then step back */
function beachSpot(yaw, back = 6) {
  const ca = Math.cos(yaw), sa = Math.sin(yaw);
  let rw = 0;
  for (let r = 60; r < WORLD * 0.62; r += 0.5) { const x = cx0 + ca * r, z = cz0 + sa * r; if (W.biomeAt(x, z) === B.OCEAN && W.height(x, z) < -0.1) { rw = r; break; } }
  let r = rw - 1;
  while (r > 60 && W.height(cx0 + ca * r, cz0 + sa * r) < 0.25) r -= 0.5;
  r -= back;
  return [cx0 + ca * r, cz0 + sa * r];
}
function roadNear(x, z, r) { for (let a = 0; a < 8; a++) for (const d of [r * 0.5, r]) if (W.isRoad(x + Math.cos(a * 0.785) * d, z + Math.sin(a * 0.785) * d)) return true; return W.isRoad(x, z); }
const spots = {};
spots.forest = bestSpot((x, z) => biomeFrac(x, z, B.FOREST, 30) * 3 + Math.min(treesNear(x, z, 22), 30) * 0.05 - (treesNear(x, z, 3) > 0 ? 5 : 0) - Math.abs(W.height(x + 4, z) - W.height(x - 4, z)) * 0.5);
spots.grass = bestSpot((x, z) => biomeFrac(x, z, B.GRASS, 40) * 3 - Math.abs(treesNear(x, z, 30) - 4) * 0.08 - (treesNear(x, z, 8) > 0 ? 3 : 0) - Math.abs(W.height(x + 6, z) - W.height(x - 6, z)) * 0.6);

// ------------------------------------------------------------------ views
const VIEWS = {
  beach_noon: () => { const [x, z] = beachSpot(90 * DEG); return { x, z, yaw: 90 * DEG, pitch: -3 * DEG, t: 0.5, w: 0 }; },
  afternoon: () => { const [x, z] = beachSpot(150 * DEG); return { x, z, yaw: 150 * DEG, pitch: -2 * DEG, t: 0.63, w: 0 }; },
  forest: () => ({ x: spots.forest[0], z: spots.forest[1], yaw: 35 * DEG, pitch: 2 * DEG, t: 0.42, w: 0 }),
  grassland: () => ({ x: spots.grass[0], z: spots.grass[1], yaw: 200 * DEG, pitch: -2 * DEG, t: 0.38, w: 0 }),
  dusk: () => { const [x, z] = beachSpot(182 * DEG); return { x, z, yaw: 182 * DEG, pitch: 2 * DEG, t: 0.745, w: 0 }; },
  dusk_land: () => ({ x: spots.grass[0], z: spots.grass[1], yaw: 180 * DEG, pitch: 3 * DEG, t: 0.735, w: 0 }),
  dawn: () => { const [x, z] = beachSpot(-8 * DEG); return { x, z, yaw: -8 * DEG, pitch: 2 * DEG, t: 0.262, w: 0 }; },
  night: () => ({ x: spots.grass[0], z: spots.grass[1], yaw: 60 * DEG, pitch: 10 * DEG, t: 0.9, w: 0 }),
  night_sea: () => { const [x, z] = beachSpot(55 * DEG); return { x, z, yaw: 55 * DEG, pitch: 6 * DEG, t: 0.92, w: 0 }; },
  overcast: () => ({ x: spots.grass[0], z: spots.grass[1], yaw: 120 * DEG, pitch: 2 * DEG, t: 0.45, w: 0.85 }),
  overcast_sea: () => { const [x, z] = beachSpot(120 * DEG); return { x, z, yaw: 120 * DEG, pitch: -1 * DEG, t: 0.47, w: 0.9 }; },
};

// ------------------------------------------------------------------ camera state + render
const cam = { x: 400, z: 400, yaw: 0, pitch: 0, eye: 1.62 }; window.cam = cam;
let dayT = 0.5, weather = 0, envT = 3, viewName = '';
function frame(dt) {
  const y = Math.max(W.height(cam.x, cam.z), -0.4) + cam.eye;
  R.setFP(cam.x, y, cam.z, cam.yaw, cam.pitch, 0, 0);
  const env = R.setTime(dayT, weather);
  R.updateShadowBox(cam.yaw);
  grass.update(cam.x, cam.z, envT, env.night);
  water.update(envT, R.sunDir, scene.fog.color, env.night, sky);
  V.updateLOD(cam.x, cam.z);
  R.r.info.reset();
  renderScene();
  const I = R.r.info.render, gs = grass.stats;
  document.getElementById('hud').textContent =
    `${viewName}  t=${dayT.toFixed(3)} w=${weather.toFixed(2)}  pos ${cam.x.toFixed(1)},${cam.z.toFixed(1)} yaw ${(cam.yaw / DEG).toFixed(0)}  biome ${W.biomeAt(cam.x, cam.z)}\n` +
    `calls ${I.calls}  tris ${(I.triangles / 1000).toFixed(0)}k  grass ${gs.live}/${gs.instances}  fov ${R.camera.fov.toFixed(1)}  fog ${scene.fog.near.toFixed(0)}-${scene.fog.far.toFixed(0)}  far ${R.camera.far}\n` +
    `gen ${tGen.toFixed(0)}ms  sky+grass+water init ${tMods.toFixed(0)}ms`;
}
window.shot = (name, over = {}) => {
  const v = Object.assign(VIEWS[name] ? VIEWS[name]() : {}, over);
  viewName = name; Object.assign(cam, { x: v.x, z: v.z, yaw: v.yaw, pitch: v.pitch });
  dayT = v.t; weather = v.w; envT = v.env ?? 3.2;
  frame(0);
  return { calls: R.r.info.render.calls, tris: R.r.info.render.triangles, grass: grass.stats, x: cam.x, z: cam.z };
};
window.info = () => ({ calls: R.r.info.render.calls, tris: R.r.info.render.triangles, grass: grass.stats, programs: R.r.info.programs.length });

// ------------------------------------------------------------------ UI / controls (for manual use)
const ui = document.getElementById('ui');
for (const k of Object.keys(VIEWS)) { const b = document.createElement('button'); b.textContent = k; b.onclick = () => { shot(k); }; ui.appendChild(b); }
const mk = (label, min, max, step, get, set) => { const l = document.createElement('label'); l.textContent = label + ' '; const i = document.createElement('input'); i.type = 'range'; i.min = min; i.max = max; i.step = step; i.value = get(); i.oninput = () => set(+i.value); l.appendChild(i); ui.appendChild(l); return i; };
const sT = mk('time', 0, 1, 0.001, () => dayT, v => dayT = v), sW = mk('wx', 0, 1, 0.01, () => weather, v => weather = v);
const keys = {}; addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'BracketRight') dayT = (dayT + 0.01) % 1; if (e.code === 'BracketLeft') dayT = (dayT + 0.99) % 1; if (e.code === 'KeyO') weather = weather > 0.5 ? 0 : 0.9; });
addEventListener('keyup', e => keys[e.code] = false);
let drag = null; const cv = document.getElementById('c');
cv.addEventListener('pointerdown', e => drag = [e.clientX, e.clientY]); addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (!drag) return; cam.yaw += (e.clientX - drag[0]) * 0.005; cam.pitch = Math.max(-1.3, Math.min(1.3, cam.pitch - (e.clientY - drag[1]) * 0.005)); drag = [e.clientX, e.clientY]; });

const init = q.get('view') || 'beach_noon';
shot(init, Object.fromEntries(['x', 'z', 't', 'w'].filter(k => q.has(k)).map(k => [k === 'w' ? 'w' : k, +q.get(k)]).concat(['yaw', 'pitch'].filter(k => q.has(k)).map(k => [k, +q.get(k) * DEG]))));
sT.value = dayT; sW.value = weather;
document.title = 'ready';
if (!q.get('static')) {
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; envT += dt;
    const sp = (keys.ShiftLeft ? 6 : 1.6) * dt, f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    cam.x += (Math.cos(cam.yaw) * f - Math.sin(cam.yaw) * s) * sp; cam.z += (Math.sin(cam.yaw) * f + Math.cos(cam.yaw) * s) * sp;
    frame(dt); sT.value = dayT; sW.value = weather;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
