<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viewmodel Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141a; overflow: hidden; font: 12px/1.3 system-ui, sans-serif; color: #e8e4da; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: absolute; left: 6px; top: 4px; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
  #ui { position: absolute; left: 6px; bottom: 6px; right: 6px; display: flex; flex-wrap: wrap; gap: 3px; }
  #ui button { font: 11px system-ui, sans-serif; padding: 3px 6px; border: 1px solid #4a4f58; background: rgba(20,24,30,0.75); color: #e8e4da; border-radius: 4px; }
  #ui button.on { background: #b07a2a; border-color: #e0a850; color: #111; }
  #ui .sep { width: 100%; height: 0; }
  #cross { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.7); pointer-events: none; }
  body.shot #ui, body.shot #hud { display: none; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="cross"></div>
<div id="ui"></div>
<script type="module">
// Dev page for src/fp/viewmodel.js
//   live:   viewmodel.html                       WASD move, Shift sprint, C crouch, Space jump, drag = look,
//           right mouse = ADS, left = fire / swing, R reload, G (hold) cock + release throw, E use, H hammer
//   frozen: viewmodel.html?item=ar&s=reload&t=0.5[&ads=1][&day=0.5][&ph=1.2][&shot=1]
//           s = idle walk sprint crouch jump land ads fire auto reload swing throw cock use equip hammer draw bowfire look
import * as THREE from '../lib/three.module.min.js';
import { M } from '../src/gfx/materials.js';
import { makeHeld, HELD_INFO } from '../src/gfx/models_chars.js';
import { ViewModel } from '../src/fp/viewmodel.js';

const q = new URLSearchParams(location.search);
const FROZEN = q.has('s');
if (q.get('shot') === '1') document.body.classList.add('shot');
const DPR = +(q.get('dpr') || Math.min(2, devicePixelRatio || 1));

// ---------------------------------------------------------------- renderer (same settings as the game)
const renderer = new THREE.WebGLRenderer({ antialias: q.get('aa') === '1', powerPreference: 'high-performance', stencil: false });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.setPixelRatio(DPR);
document.body.prepend(renderer.domElement);

// ---------------------------------------------------------------- main scene
const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#a8b8c0', 40, 170);
scene.background = new THREE.Color('#a8b8c0');
const cam = new THREE.PerspectiveCamera(56, 1, 0.05, 420);
const hemi = new THREE.HemisphereLight('#d2e2ff', '#5f503e', 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff2dc', 2.2); scene.add(sun, sun.target);
M.add(scene, M.box(400, 0.2, 400, 3), M.surf('grass'), 0, -0.1, 0, { cast: false });
M.add(scene, M.box(3, 0.02, 60, 3), M.surf('dirt'), 1.5, 0.005, -20, { cast: false });
const crates = [[-2.2, -5, 1.0], [3.4, -7.5, 1.2], [-6, -14, 1.4], [6, -18, 2], [-1.5, -24, 1.1], [9, -30, 2.4]];
for (const [x, z, s] of crates) M.add(scene, M.box(s, s, s, 2), M.surf('plank'), x, s / 2, z, { ry: x * 0.3 });
M.add(scene, M.box(14, 3, 0.4, 3), M.surf('concrete'), -10, 1.5, -26, { ry: 0.3 });
M.add(scene, M.box(5, 2.2, 0.3, 3), M.surf('brick'), 7, 1.1, -12, { ry: -0.5 });
for (let i = 0; i < 26; i++) {
  const a = i * 2.4, r = 16 + (i * 7.3) % 40, x = Math.cos(a) * r, z = -Math.abs(Math.sin(a) * r) - 10;
  M.add(scene, M.cyl(0.18, 0.26, 3, 7), M.mat('#5a4030'), x, 1.5, z);
  M.add(scene, M.cone(1.6, 4.2, 8), M.mat('#2f5a3a', { flat: true }), x, 4.4, z);
}
const rocks = [[2, -4, 0.35], [-3.5, -9, 0.5], [0.5, -11, 0.3]];
for (const [x, z, s] of rocks) M.add(scene, M.ico(s, 0), M.mat('#8d8a84', { flat: true }), x, s * 0.5, z);

// ---------------------------------------------------------------- time of day (mirrors Renderer.setTime)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const sunDir = new THREE.Vector3();
let night = 0;
function setTime(t) {
  const ang = (t - 0.25) * Math.PI * 2, elev = Math.sin(ang);
  const day = clamp(elev * 3 + 0.25, 0, 1), dusk = clamp(1 - Math.abs(elev) * 4, 0, 1) * (elev > -0.35 ? 1 : 0);
  night = 1 - day;
  const az = (t - 0.25) * Math.PI * 2;
  if (elev > -0.05) sunDir.set(-Math.cos(az) * 0.8, Math.max(0.3, elev) + 0.15, 0.45).normalize(); else sunDir.set(Math.cos(az) * 0.6, 0.85, 0.35).normalize();
  sun.color.set(day > 0.02 ? '#fff2dc' : '#9fb4e8'); if (day > 0.02) sun.color.lerp(new THREE.Color('#ff9a52'), dusk * 0.85);
  sun.intensity = day > 0.02 ? lerp(0.6, 2.4, day) : 0.55;
  hemi.intensity = lerp(0.62, 1.0, day);
  hemi.color.set(day > 0.02 ? '#d2e2ff' : '#7a8cc8').lerp(new THREE.Color('#ffc890'), dusk * 0.35);
  hemi.groundColor.set(day > 0.02 ? '#5f503e' : '#2a2a3c');
  const fc = new THREE.Color('#121a2c').lerp(new THREE.Color('#b9c8cc').lerp(new THREE.Color('#e8b48a'), dusk * 0.6), day);
  scene.fog.color.copy(fc); scene.background.copy(fc);
  renderer.toneMappingExposure = lerp(1.45, 1.05, day);
  sun.position.copy(sunDir).multiplyScalar(60); sun.target.position.set(0, 0, 0);
}
setTime(+(q.get('day') ?? (q.get('night') === '1' ? 0.0 : 0.42)));

// ---------------------------------------------------------------- viewmodel
const vm = new ViewModel({ makeHeld, HELD_INFO });
window.vm = vm;
vm.setLook({ skin: q.get('skin') || '#c69472', sleeve: q.get('sleeve') || '#5f6650', glove: q.get('glove') || undefined });
function syncLights() {
  vm.setLighting({ hemiSky: hemi.color, hemiGround: hemi.groundColor, hemiIntensity: hemi.intensity, sunDir, sunColor: sun.color, sunIntensity: sun.intensity, extra: [] });
}
syncLights();

// weapon timings (from src/data.js)
const RELOAD = { bow: 0.55, pipe_pistol: 1.8, revolver: 2.2, boomstick: 2.4, pump: 3.0, smg: 2.4, ar: 2.6, hunting: 3.2, rocket_launcher: 3.6,
  crossbow: 2.3, nailgun: 2.1, semi_rifle: 2.6, sniper: 3.8, lmg: 5.2, waterpipe: 2.1, semi_pistol: 1.6, magnum: 2.8, tac_smg: 2.2, lancer: 2.4, auto_shotgun: 3.4 };
const ROF = { bow: 1.1, pipe_pistol: 3, revolver: 2, boomstick: 3, pump: 1.3, smg: 9, ar: 7.5, hunting: 0.85, rocket_launcher: 0.6,
  crossbow: 1, nailgun: 6.5, semi_rifle: 3.6, sniper: 0.6, lmg: 10, waterpipe: 1, semi_pistol: 6, magnum: 1.6, tac_smg: 11, lancer: 8.2, auto_shotgun: 3.2 };
const RATE = { fists: 2.0, rock: 1.55, torch: 1.7, spear_wood: 1.3, knife: 2.2, machete: 1.6, hatchet: 1.8, pickaxe: 1.5, salv_axe: 1.9, salv_pick: 1.6, hammer: 1.8 };
const ITEMS = ['fists', 'rock', 'torch', 'hatchet', 'pickaxe', 'machete', 'knife', 'spear_wood', 'bow', 'pipe_pistol', 'revolver', 'boomstick', 'pump', 'smg', 'ar', 'hunting', 'rocket_launcher',
  'crossbow', 'nailgun', 'semi_rifle', 'sniper', 'lmg', 'waterpipe', 'semi_pistol', 'magnum', 'tac_smg', 'lancer', 'auto_shotgun', 'grenade', 'beancan', 'bandage', 'stim', 'cooked_meat', 'water_bottle', 'buildplan', 'hammer', 'flare'];
// weapon attachments: ?att=att_holo,att_silencer,att_laser,att_extmag (slot from the id); ?laser=metres to the dot
const ATT_SLOT = { att_holo: 'sight', att_scope4: 'sight', att_scope8: 'sight', att_silencer: 'muzzle', att_brake: 'muzzle', att_laser: 'rail', att_flashlight: 'rail', att_extmag: 'mag' };
const ATT = q.get('att') ? Object.fromEntries(q.get('att').split(',').filter(a => ATT_SLOT[a]).map(a => [ATT_SLOT[a], a])) : null;
if (q.get('laser')) vm.laserD = +q.get('laser');

// ---------------------------------------------------------------- camera / input state
let yaw = 0, pitch = -0.05;
const st = { speed: 0, sprint: false, crouch: false, air: false, ads: 0, lookDX: 0, lookDY: 0, fire: 0, recoil: 0, reload: -1, swing: -1, throw: -1, use: -1, hammer: -1, night: 0, empty: false, aimThrow: false };
let curItem = q.get('item') || 'ar';
const itemId = () => (curItem === 'fists' ? null : curItem);
vm.setAttach(itemId(), ATT);
vm.setItem(itemId());
// dev tuning: override the hip pose of the current item (x,y,z,pitch,yaw,roll)
if (q.get('hip')) vm.cfg.hip.pose(q.get('hip').split(',').map(Number));

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
}
resize(); addEventListener('resize', resize);

function drawFrame() {
  cam.position.set(0, 1.62, 0);
  cam.rotation.set(pitch, -yaw, 0, 'YXZ');
  cam.updateMatrixWorld();
  renderer.autoClear = true;
  renderer.render(scene, cam);
  renderer.autoClear = false;
  if (q.get('vcam')) { const v = q.get('vcam').split(',').map(Number); vm.camera.position.set(v[0], v[1], v[2]); vm.camera.lookAt(v[3], v[4], v[5]); vm.camera.fov = v[6] || 58; vm.camera.updateProjectionMatrix(); }
  vm.render(renderer, cam.aspect, cam);
  renderer.autoClear = true;
  const info = renderer.info.render;
  window.vmCalls = info.calls; window.vmTris = info.triangles;
  hud.textContent = `${curItem}  ${FROZEN ? (q.get('s') + ' t=' + (q.get('t') || '')) : 'live'}   vm draw calls ${info.calls}  tris ${info.triangles}`;
}
const hud = document.getElementById('hud');

// ---------------------------------------------------------------- frozen states (deterministic)
const DT = 1 / 60;
function step(n, mut) { for (let i = 0; i < n; i++) { if (mut) mut((i + 1) * DT); st.night = night; vm.update(DT, st); st.fire = 0; st.lookDX = st.lookDY = 0; } }
function secs(s) { return Math.max(1, Math.round(s / DT)); }
function runFrozen() {
  const S = q.get('s'), t = +(q.get('t') ?? 0.5), adsOn = q.get('ads') === '1';
  const id = itemId();
  if (q.get('empty') === '1') st.empty = true;
  step(secs(1.0));
  const toAds = () => step(secs(0.35), x => { st.ads = Math.min(1, x * 6); });
  if (adsOn && S !== 'ads') toAds();
  switch (S) {
    case 'idle': step(secs(0.6)); break;
    case 'walk': st.speed = 3.6; step(secs(1.0)); { const ph = q.get('ph'); if (ph) { vm.phase = +ph; } } step(1); break;
    case 'sprint': st.speed = 6.2; st.sprint = true; step(secs(1.0)); { const ph = q.get('ph'); if (ph) vm.phase = +ph; } step(1); break;
    case 'crouch': st.crouch = true; step(secs(0.7)); break;
    case 'jump': st.air = true; step(secs(t || 0.12)); break;
    case 'land': st.air = true; step(secs(0.45)); st.air = false; step(secs(t || 0.08)); break;
    case 'ads': toAds(); step(secs(0.3)); break;
    case 'look': step(secs(0.25), () => { st.lookDX = 2.2 * DT; st.lookDY = 0.6 * DT; }); break;
    case 'fire': st.fire = 1; step(1); step(secs(t || 0.03)); break;
    case 'auto': { const iv = 1 / (ROF[id] || 8); let acc = 0; step(secs(0.5), () => { acc += DT; if (acc >= iv) { acc -= iv; st.fire = 1; } }); st.fire = 1; step(1); step(2); break; }
    case 'reload': {
      if (id === 'bow') { st.fire = 1; step(2); }
      if (id === 'rocket_launcher') { st.fire = 1; step(secs(0.4)); }
      const dur = RELOAD[id] || 2; const n = secs(dur * t); step(n, x => { st.reload = Math.min(1, x / dur); }); break;
    }
    case 'swing': { const dur = 1 / ((RATE[id || 'fists'] || 1.8) * 1.35); if (q.get('second') === '1') { step(secs(dur), x => { st.swing = x / dur; }); st.swing = -1; step(4); } step(secs(dur * t), x => { st.swing = Math.min(1, x / dur); }); break; }
    case 'cock': st.aimThrow = true; step(secs(0.5)); break;
    case 'throw': st.aimThrow = true; step(secs(0.45)); st.aimThrow = false; step(secs(t / 3), x => { st.throw = Math.min(1, x * 3); }); break;
    case 'use': { const dur = 2.0; step(secs(dur * t), x => { st.use = Math.min(1, x / dur); }); break; }
    case 'equip': vm.setItem(null); step(secs(0.6)); vm.setItem(id); step(secs(0.42 * t)); break;
    case 'hammer': step(secs(t / 3), x => { st.hammer = Math.min(1, x * 3); }); break;
    case 'draw': step(secs(0.9), x => { st.ads = Math.min(1, x * 6); }); break;
    case 'bowfire': step(secs(0.9), x => { st.ads = Math.min(1, x * 6); }); st.fire = 1; step(1); step(secs(t || 0.05)); break;
    default: step(secs(0.3));
  }
  drawFrame();
  window.done = true;
}

// ---------------------------------------------------------------- live mode
const keys = {}; let mouseL = false, mouseR = false, dragging = null, fireAcc = 0, jumpT = 0, reloadT = -1, swingT = -1, throwT = -1, useT = -1, hamT = -1;
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === ' ') { if (jumpT <= 0) jumpT = 0.62; e.preventDefault(); } if (e.key === 'r' && reloadT < 0 && RELOAD[curItem]) reloadT = 0; if (e.key === 'e' && useT < 0) useT = 0; if (e.key === 'h') hamT = 0; if (e.key === 'g') st.aimThrow = true; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; if (e.key === 'g') { st.aimThrow = false; throwT = 0; } });
const cv = renderer.domElement;
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => { if (e.button === 2) mouseR = true; else { mouseL = true; dragging = { x: e.clientX, y: e.clientY }; } });
addEventListener('pointerup', e => { if (e.button === 2) mouseR = false; else { mouseL = false; dragging = null; } });
addEventListener('pointermove', e => {
  if (dragging) { const dx = e.clientX - dragging.x, dy = e.clientY - dragging.y; dragging.x = e.clientX; dragging.y = e.clientY; const ly = dx * 0.005, lp = -dy * 0.004; yaw += ly; pitch = clamp(pitch + lp, -1.3, 1.3); st.lookDX += ly; st.lookDY += lp; }
});
function liveStep(dt) {
  const fwd = (keys.w ? 1 : 0) - (keys.s ? 1 : 0), side = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
  const moving = fwd || side;
  st.sprint = !!keys.shift && fwd > 0; st.crouch = !!keys.c;
  st.speed = moving ? (st.sprint ? 6.2 : st.crouch ? 1.9 : 3.6) : 0;
  st.ads = clamp(st.ads + (mouseR ? dt * 6 : -dt * 7), 0, 1);
  if (jumpT > 0) { jumpT -= dt; st.air = jumpT > 0; } else st.air = false;
  const isGun = RELOAD[curItem] != null;
  if (mouseL && isGun && reloadT < 0) { fireAcc -= dt; if (fireAcc <= 0) { st.fire = 1; fireAcc = 1 / ROF[curItem]; if (curItem === 'bow') reloadT = -0.25; } } else fireAcc = Math.min(fireAcc, 0);
  if (reloadT < -0.001) { reloadT += dt; if (reloadT >= 0) reloadT = 0; }
  if (reloadT >= 0) { reloadT += dt / RELOAD[curItem]; st.reload = reloadT; if (reloadT >= 1) { reloadT = -1; st.reload = -1; } } else st.reload = -1;
  if (mouseL && !isGun && swingT < 0) swingT = 0;
  if (swingT >= 0) { swingT += dt * (RATE[curItem] || 1.8) * 1.35; st.swing = swingT; if (swingT >= 1) { swingT = -1; st.swing = -1; } }
  if (throwT >= 0) { throwT += dt * 3; st.throw = throwT; if (throwT >= 1) { throwT = -1; st.throw = -1; } }
  if (useT >= 0) { useT += dt / 2; st.use = useT; if (useT >= 1) { useT = -1; st.use = -1; } }
  if (hamT >= 0) { hamT += dt * 3; st.hammer = hamT; if (hamT >= 1) { hamT = -1; st.hammer = -1; } }
  st.night = night;
  vm.update(dt, st);
  st.fire = 0; st.lookDX = st.lookDY = 0;
}
function buildUI() {
  const ui = document.getElementById('ui');
  for (const id of ITEMS) {
    const b = document.createElement('button'); b.textContent = id; if (id === curItem) b.className = 'on';
    b.onclick = () => { curItem = id; vm.setItem(itemId()); for (const x of ui.querySelectorAll('button.it')) x.classList.toggle('on', x.textContent === id); };
    b.classList.add('it'); ui.appendChild(b);
  }
  const sep = document.createElement('div'); sep.className = 'sep'; ui.appendChild(sep);
  const act = [['reload (R)', () => { if (RELOAD[curItem]) reloadT = 0; }], ['use (E)', () => { useT = 0; }], ['hammer (H)', () => { hamT = 0; }], ['throw', () => { throwT = 0; }], ['day', () => { setTime(0.42); syncLights(); }], ['dusk', () => { setTime(0.74); syncLights(); }], ['night', () => { setTime(0.0); syncLights(); }]];
  for (const [n, f] of act) { const b = document.createElement('button'); b.textContent = n; b.onclick = f; ui.appendChild(b); }
}

if (q.get('dbg')) { const d = q.get('dbg').split(',').map(Number); vm.dbg = { r: d.slice(0, 6), l: [-d[0], d[1], d[2], d[3], -d[4], -d[5]], pose: q.get('pose') || 'fist' }; }
if (FROZEN) {
  const ph = q.get('yaw'); if (ph) yaw = +ph;
  runFrozen();
} else {
  buildUI();
  let last = performance.now();
  const loop = now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; liveStep(dt); drawFrame(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  window.done = true;
}
</script>
</body>
</html>
