<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zonefall">
<meta name="theme-color" content="#0f0e14">
<meta name="description" content="Zonefall: an open-world 2.5D survival base-builder. Gather, build, raid monuments and defend your base from nightly raids.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>Zonefall</title>
<style>
:root{--bg:#0f0e14;--panel:rgba(20,19,26,.95);--panel2:#25232f;--panel3:#1b1a22;--line:#3c3a48;--text:#ece3cf;--dim:#9a96a6;--amber:#f2b14a;--orange:#e07a35;--red:#e04848;--green:#6cc85a;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:none}
#view{position:fixed;inset:0;display:block;touch-action:none}
#overlay{position:fixed;inset:0;pointer-events:none;z-index:5}
.hidden{display:none!important}
img{image-rendering:pixelated}
img:not([src]),img[src=""]{visibility:hidden}
button{font:inherit;font-weight:700;color:var(--text);background:#2c2a36;border:2px solid #4a4758;border-bottom-width:4px;border-radius:10px;padding:8px 13px;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(2px);border-bottom-width:2px}
button:disabled{opacity:.4}
button.primary{background:linear-gradient(#f5bb55,#d77a2e);border-color:#ffd58a #ffd58a #8a4418;color:#2a1608}
button.danger{background:#5a2026;border-color:#8a3a40}
button.mini{padding:4px 8px;font-size:11px;border-bottom-width:3px}
.dim{color:var(--dim)}.small{font-size:12px}.bad{color:#ff8a7a!important}.good{color:#9ae08a!important}
.c-common{color:#ece3cf}.c-uncommon{color:#8fe07a}.c-rare{color:#6cc4ff}.c-epic{color:#d08aff}.c-legendary{color:#ffc040}

/* ---------------- HUD ---------------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud button,#hud .hs,#minimap,#tut{pointer-events:auto}
#status{position:absolute;left:calc(10px + var(--sal));top:calc(8px + var(--sat));width:min(210px,30vw);background:rgba(12,11,16,.55);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px 8px}
.bar{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.bar img{width:16px;height:16px;flex:none}
.bar .tr{position:relative;flex:1;height:12px;background:#121016;border:1px solid #000;border-radius:4px;overflow:hidden}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;transition:width .15s}
#bar-hp .tr i{background:linear-gradient(#ff7060,#c02a30)}#bar-food .tr i{background:linear-gradient(#f0b860,#b8742a)}#bar-water .tr i{background:linear-gradient(#70c0f0,#2a78b8)}
.bar .tr b{position:absolute;inset:0;font-size:9.5px;line-height:11px;text-align:center;text-shadow:0 1px 0 #000,0 0 3px #000;font-weight:800}
.bar.low .tr{animation:pulse 1s infinite}
#chips{display:flex;gap:3px;flex-wrap:wrap}
.st{font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:4px;background:#2c2a3a;letter-spacing:.4px}
.st.bad{background:#8a1a24}.st.rad{background:#4a5a10}.st.good{background:#1a5a3a}
@keyframes pulse{50%{opacity:.55}}
#topc{position:absolute;left:50%;top:calc(48px + var(--sat));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;width:min(46vw,470px)}
#clock{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;background:rgba(12,11,16,.55);border-radius:20px;padding:3px 12px;text-shadow:0 1px 0 #000}
#clock img{width:16px;height:16px}
#tut{font-size:12.5px;line-height:1.3;color:#1a1208;background:linear-gradient(#ffe48a,#f2b14a);border:2px solid #1a1208;border-radius:9px;padding:5px 9px;box-shadow:0 3px 0 #1a1208;display:flex;gap:7px;align-items:flex-start;font-weight:600}
#tut:empty{display:none}
#tut .n{background:#1a1208;color:#ffe48a;border-radius:4px;padding:0 5px;font-size:10.5px;flex:none;margin-top:1px;font-weight:800}
#tut .sk{margin-left:auto;font-size:10.5px;opacity:.7;text-decoration:underline;flex:none;cursor:pointer}
#topr{position:absolute;right:calc(8px + var(--sar));top:calc(6px + var(--sat));display:flex;gap:6px;align-items:flex-start}
#minimap{width:104px;height:104px;border-radius:50%;background:#000;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.col{display:flex;flex-direction:column;gap:5px}
.sb{width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(20,19,26,.8);border-radius:10px;border-width:2px 2px 3px}
.sb img{width:24px;height:24px}
#acts{position:absolute;right:calc(10px + var(--sar));bottom:calc(10px + var(--sab));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.arow{display:flex;gap:8px;align-items:flex-end}
.ab{position:relative;width:52px;height:52px;border-radius:50%;background:rgba(20,19,26,.78);border:2px solid rgba(236,227,207,.3);border-bottom-width:4px;padding:0;display:flex;align-items:center;justify-content:center}
.ab img{width:28px;height:28px}
.ab.down{background:rgba(242,177,74,.55)}
.ab.dim{opacity:.45}
.ab .cnt{position:absolute;right:-4px;bottom:-4px;background:#121016;border:1px solid #5a5868;border-radius:8px;font-size:10px;padding:0 4px;min-width:16px}
#b-interact{width:70px;height:70px;background:rgba(215,118,44,.9);border-color:#f5bb55 #f5bb55 #8a4418}
#b-interact img{width:36px;height:36px}
#b-interact .lab{position:absolute;right:78px;top:50%;transform:translateY(-50%);white-space:nowrap;background:rgba(20,19,26,.92);border:2px solid #f2b14a;border-radius:8px;padding:4px 9px;font-size:12px;color:#ffe48a;pointer-events:none}
#hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + var(--sab));display:flex;gap:5px;background:rgba(12,11,16,.45);padding:4px;border-radius:12px}
.hs{position:relative;width:50px;height:50px;background:rgba(27,26,34,.88);border:2px solid #44424f;border-radius:9px;display:flex;align-items:center;justify-content:center}
.hs img{width:38px;height:38px}
.hs b{position:absolute;right:3px;bottom:1px;font-size:10.5px;font-weight:900;text-shadow:0 1px 0 #000,0 0 2px #000}
.hs i{position:absolute;left:3px;right:3px;bottom:2px;height:2px;background:#ffe48a;width:0}
.hs u{position:absolute;left:3px;top:0;font-size:9px;color:var(--dim);text-decoration:none;font-weight:700}
.hs.sel{border-color:var(--amber);background:rgba(90,58,26,.9);box-shadow:0 0 0 2px rgba(242,177,74,.35)}
body.building #hotbar,body.building #acts,body.building #tut{display:none}
#killfeed{position:absolute;right:calc(130px + var(--sar));top:calc(10px + var(--sat));display:flex;flex-direction:column;gap:3px;align-items:flex-end}
#chatlog{position:absolute;left:calc(10px + var(--sal));top:calc(118px + var(--sat));display:flex;flex-direction:column;gap:2px;max-width:min(300px,38vw)}
.chatl{font-size:11.5px;background:rgba(12,11,16,.55);padding:2px 7px;border-radius:5px;transition:opacity .5s;text-shadow:0 1px 0 #000}.chatl.out{opacity:0}
.kf{font-size:12px;font-weight:800;background:rgba(120,20,20,.75);padding:2px 8px;border-radius:5px}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(190,20,20,.65) 100%)}
#toasts{position:fixed;left:50%;bottom:calc(118px + var(--sab));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:30}
.toast{background:rgba(20,19,26,.92);border:2px solid #3c3a48;border-radius:8px;padding:5px 12px;font-size:12.5px;font-weight:700;transition:opacity .4s;max-width:76vw;text-align:center}
.toast.bad{border-color:#a22633;color:#ffb0a0}.toast.good{border-color:#3e8948;color:#b8f0a0}.toast.out{opacity:0}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;z-index:25;animation:bin 3.6s forwards}
#banner b{display:block;font-size:clamp(26px,5vw,44px);letter-spacing:9px;font-weight:900;color:#ece3cf;text-shadow:0 4px 0 #121016,0 0 30px rgba(0,0,0,.7)}
#banner small{display:block;color:var(--amber);font-size:14px;font-weight:700;letter-spacing:1px;text-shadow:0 2px 0 #121016}
@keyframes bin{0%{opacity:0;transform:scale(1.15)}10%,80%{opacity:1;transform:scale(1)}100%{opacity:0}}
#prog{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);width:min(280px,46vw);height:16px;background:#121016;border:2px solid #000;border-radius:5px;overflow:hidden;z-index:30}
#prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffe48a,#e07a35)}
#prog b{position:absolute;inset:0;font-size:10px;line-height:13px;text-align:center;text-shadow:0 1px 0 #000}

/* ---------------- sheets ---------------- */
#shade{position:fixed;inset:0;background:rgba(8,7,12,.5);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96vw,640px);max-height:calc(100vh - 16px - var(--sat) - var(--sab));display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.sheet.wide{width:min(97vw,980px)}
.sheet.mapsheet{width:auto;max-width:97vw}
.sh-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.sh-head>b{font-size:15px;letter-spacing:2px;color:var(--amber);text-transform:uppercase}
.sh-head .tabs{display:flex;gap:4px;margin-left:8px}
.sh-head .tabs button{padding:4px 10px;font-size:12px;border-bottom-width:3px}
.sh-head .tabs button.on{background:#5a3a1a;border-color:var(--amber);color:#fff}
.sh-x{margin-left:auto;padding:4px 12px}
.sh-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 10px;touch-action:pan-y}
.lbl{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#c8c2d4;margin:6px 0 4px;font-weight:800}
.inv-wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:5px}
.grid.belt{grid-template-columns:repeat(6,minmax(0,1fr))}
.slot{position:relative;aspect-ratio:1;background:#1d1c24;border:2px solid #3c3a48;border-radius:8px;display:flex;align-items:center;justify-content:center;min-height:44px;cursor:pointer}
.slot img{width:76%;height:76%;pointer-events:none}
.slot b{position:absolute;right:3px;bottom:1px;font-size:10.5px;font-weight:900;text-shadow:0 1px 0 #000,0 0 2px #000}
.slot i{position:absolute;left:4px;bottom:3px;height:2px;background:#ffe48a}
.slot.empty{background:#16151b;border-style:dashed}
.slot.picked{outline:3px solid var(--amber);outline-offset:-1px}
.slot.c-uncommon{border-color:#3e8948}.slot.c-rare{border-color:#2f7fc0}.slot.c-epic{border-color:#9a52c9}.slot.c-legendary{border-color:#e0a030}
.slot small{font-size:9px;color:var(--dim);text-transform:uppercase;font-weight:700}
.equip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.stats{font-size:11.5px;color:var(--dim);margin:5px 0}
.stats b{color:var(--text)}
.detail{background:var(--panel3);border:2px solid var(--line);border-radius:10px;padding:8px;margin-top:8px}
.detail p{margin:0;font-size:12px}
.dt-h{display:flex;gap:8px;align-items:center}.dt-h img{width:40px;height:40px}.dt-h small{display:block;color:var(--dim);font-size:11.5px}
.acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.acts button{padding:6px 10px;font-size:12.5px}
.quick{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:6px 0}
.cats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}.cats button{padding:4px 9px;font-size:12px;border-bottom-width:3px}.cats button.on{background:#5a3a1a;border-color:var(--amber);color:#fff}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:5px}
.rec{display:flex;align-items:center;gap:8px;background:var(--panel3);border:2px solid var(--line);border-radius:10px;padding:5px 8px}
.rec img{width:38px;height:38px;flex:none}.rec .rt{flex:1;min-width:0}.rec .rt b{display:block;font-size:13px}.rec small{display:block;font-size:11px;color:var(--dim)}
.rec.no{opacity:.7}.rec.locked{opacity:.45}.rec button{padding:6px 10px;font-size:12.5px}.lockt{color:#d0a0ff!important}
.queue{margin-top:8px;font-size:12px;color:var(--amber)}
.bigmap{display:block;border-radius:8px;border:2px solid var(--line)}
.legend{font-size:11px;color:var(--dim);margin-top:5px}
.pause{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:260px}.pause p{text-align:center;color:var(--dim)}
.settings{display:flex;flex-direction:column;gap:10px;min-width:280px}.settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.settings select,.settings input[type=range]{font:inherit;min-width:140px}

/* ---------------- build bar ---------------- */
#buildbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(16,15,22,.94);border-top:2px solid var(--line);padding:5px calc(8px + var(--sar)) calc(5px + var(--sab)) calc(8px + var(--sal));pointer-events:auto}
.bcats{display:flex;gap:4px;overflow-x:auto;touch-action:pan-x}
.bcats button{display:flex;align-items:center;gap:4px;padding:4px 9px;font-size:12px;border-bottom-width:3px;flex:none}.bcats button img{width:18px;height:18px}
.bcats button.on{background:#5a3a1a;border-color:var(--amber)}.bcats .exit{margin-left:auto;background:#2a5a2a;border-color:#6cc85a #6cc85a #1a3a1a}
.bitems{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x;margin:5px 0}
.bi{flex:none;width:84px;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:10.5px;background:#221f2c;border-bottom-width:3px}
.bi img{width:26px;height:26px}.bi span{line-height:1.1;text-align:center;height:24px;overflow:hidden}.bi small{color:var(--dim);font-size:9.5px;white-space:nowrap}
.bi.on{border-color:var(--amber);background:#4a3418}.bi.poor small{color:var(--red)}
.brow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tiers{display:flex;gap:4px}.tiers button{padding:4px 8px;font-size:11.5px;border-bottom-width:3px}.tiers button.on{background:#4a3418;color:#fff}
.brow .place{margin-left:auto;padding:8px 22px;font-size:14px}
.bhint{font-size:11.5px;color:var(--dim);margin-top:4px}
.hpanel{margin-top:5px}.hname{font-size:13px;margin-bottom:4px}.hname small{color:var(--dim)}
#bwhy{position:fixed;left:50%;top:calc(46px + var(--sat));transform:translateX(-50%);z-index:29;font-size:12px;background:rgba(120,20,20,.85);border-radius:8px;padding:4px 10px;pointer-events:none;font-weight:700}

/* ---------------- menu / screens ---------------- */
#menu,#death,#loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px calc(20px + var(--sar)) 20px calc(20px + var(--sal));text-align:center;overflow:auto;touch-action:pan-y}
#menu{background:radial-gradient(ellipse at 50% 45%,rgba(10,10,14,.1) 0%,rgba(10,10,14,.78) 80%)}
.logo h1{margin:0;font-size:clamp(46px,10vw,88px);font-weight:900;letter-spacing:12px;color:#ece3cf;text-shadow:0 5px 0 #121016,0 0 40px rgba(240,140,50,.35)}
.logo p{margin:0;color:#d0c8d8;letter-spacing:3px;font-size:12px;text-transform:uppercase;font-weight:800;text-shadow:0 2px 0 #121016}
.mbtns{display:flex;flex-direction:column;gap:8px;min-width:240px;margin:14px 0}
.mbtns button{padding:12px;font-size:16px}
.mfoot{color:#a8a2b4;font-size:12px;margin:2px}.mtip{color:#d8cfb8;font-size:12px;max-width:520px;margin:4px;text-shadow:0 1px 0 #000}
#menu h2,#death h2{margin:0 0 8px;letter-spacing:6px;color:var(--amber)}
.perks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;width:min(860px,94vw);margin:8px 0}
.perk{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px}.perk small{color:var(--dim);flex:1}.perk.own{border-color:#3e8948}
.help{max-width:760px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}.help p{margin:6px 0;font-size:13px}
#death{background:rgba(30,6,8,.82)}
#death p{max-width:520px}
.resp{display:flex;flex-direction:column;gap:7px;min-width:240px}
.sum{display:grid;grid-template-columns:repeat(3,auto);gap:6px 18px;margin:8px 0}
.sum span{font-size:13px;color:var(--dim)}.sum b{color:var(--text);margin-left:4px}
#loading{background:#0f0e14}
.spin{width:34px;height:34px;border:4px solid #3c3a48;border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#rotate{position:fixed;inset:0;z-index:60;background:#0f0e14;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#rotate .ph{width:70px;height:110px;border:5px solid #ece3cf;border-radius:14px;margin-bottom:22px;animation:rot 2s ease-in-out infinite}
#rotate h2{color:var(--amber);letter-spacing:3px;margin:0 0 6px}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){ #rotate{display:flex} }
@media (max-height:430px){
  .sb{width:38px;height:38px}.sb img{width:22px;height:22px}#minimap{width:92px;height:92px}
  .ab{width:46px;height:46px}.ab img{width:24px;height:24px}#b-interact{width:62px;height:62px}
  .hs{width:44px;height:44px}.hs img{width:32px;height:32px}
  .inv-wrap{grid-template-columns:1.3fr 1fr}.slot{min-height:38px}
  .mbtns button{padding:9px;font-size:15px}.logo h1{font-size:clamp(40px,9vw,70px)}
  #tut{font-size:11px;padding:4px 8px}#topc{width:min(44vw,420px)}
  .bcats button{padding:3px 7px;font-size:11px}.bcats button img{width:15px;height:15px}
  .bi{width:66px;padding:2px}.bi img{width:20px;height:20px}.bi span{height:22px;font-size:9.5px}.bi small{font-size:8.5px}
  .bitems{margin:3px 0}.tiers button{padding:3px 6px;font-size:10.5px}.brow .place{padding:6px 16px;font-size:13px}.bhint{display:none}
  .sh-head{padding:5px 8px}.sh-body{padding:6px 8px}.sheet{border-bottom-width:3px}
}
@media (max-width:700px) and (orientation:portrait){ .inv-wrap{grid-template-columns:1fr} }

/* ---------------- first-person HUD ---------------- */
#xhair{position:absolute;left:50%;top:50%;width:0;height:0;--gap:7px;pointer-events:none}
#xhair i{position:absolute;background:rgba(255,255,255,.92);box-shadow:0 0 2px rgba(0,0,0,.9);transition:transform .05s}
#xhair .l,#xhair .r{width:8px;height:2px;top:-1px}#xhair .t,#xhair .b{width:2px;height:8px;left:-1px}
#xhair .l{right:var(--gap)}#xhair .r{left:var(--gap)}#xhair .t{bottom:var(--gap)}#xhair .b{top:var(--gap)}
#xhair .dot{width:3px;height:3px;left:-1.5px;top:-1.5px;border-radius:50%}
#xhair .hm{display:none;width:20px;height:20px;left:-10px;top:-10px;background:none;box-shadow:none;
  background:linear-gradient(45deg,transparent 45%,#fff 45%,#fff 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,#fff 45%,#fff 55%,transparent 55%)}
#xhair.hit .hm{display:block}#xhair.crit .hm{filter:hue-rotate(-40deg) saturate(6) brightness(1.1);background:linear-gradient(45deg,transparent 42%,#ff5a3a 42%,#ff5a3a 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,#ff5a3a 42%,#ff5a3a 58%,transparent 58%)}
#xhair.melee .l,#xhair.melee .r,#xhair.melee .t,#xhair.melee .b{display:none}
#xhair.ads .l,#xhair.ads .r,#xhair.ads .t,#xhair.ads .b{opacity:.55}
#xhair.scope i:not(.hm){display:none}
#scope{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(circle at 50% 50%,transparent 0,transparent 31vh,rgba(0,0,0,.96) 31.5vh)}
#scope::before,#scope::after{content:"";position:absolute;background:rgba(0,0,0,.85)}
#scope::before{left:50%;top:19vh;bottom:19vh;width:1.5px;margin-left:-.75px}#scope::after{top:50%;left:calc(50% - 31vh);right:calc(50% - 31vh);height:1.5px;margin-top:-.75px}
#prompt{position:absolute;left:50%;top:calc(50% + 26px);transform:translateX(-50%);background:rgba(12,11,16,.6);border:1px solid rgba(255,228,138,.5);color:#ffe48a;font-weight:800;font-size:13px;padding:4px 10px;border-radius:8px;white-space:nowrap;text-shadow:0 1px 0 #000}
#ammo{position:absolute;left:calc(50% + 40px);bottom:calc(70px + var(--sab));text-align:right;width:130px;text-shadow:0 1px 2px #000;line-height:1}
#ammo b{font-size:28px;font-weight:900}#ammo small{font-size:14px;color:#c8c2d4;font-weight:700;margin-left:4px}#ammo i{display:block;font-style:normal;font-size:11px;color:#c8c2d4;font-weight:700;margin-top:3px;letter-spacing:.5px;text-transform:uppercase}
#ammo.low b{color:#ff8a6a}
#pad{position:absolute;right:calc(10px + var(--sar));bottom:calc(10px + var(--sab));width:250px;height:230px;pointer-events:none}
#pad .ab{position:absolute;pointer-events:auto}
#pad .ab .gl{font-size:24px;font-weight:900;line-height:1;color:#ece3cf}
#b-fire{right:58px;bottom:62px;width:84px!important;height:84px!important;background:rgba(200,64,48,.55)!important;border-color:rgba(255,160,140,.7)!important}
#b-fire img{width:42px!important;height:42px!important}
#b-fire.down{background:rgba(240,90,60,.85)!important}
#b-ads{right:150px;bottom:126px}#b-ads.on{background:rgba(242,177,74,.65);border-color:#ffd58a}
#b-jump{right:2px;bottom:4px}#b-crouch{right:58px;bottom:2px}#b-crouch.on{background:rgba(242,177,74,.65);border-color:#ffd58a}
#b-reload{right:2px;bottom:150px}#b-heal{right:2px;bottom:94px}
#b-interact{right:150px;bottom:44px;width:62px!important;height:62px!important;background:rgba(215,118,44,.85)!important;border-color:#f5bb55 #f5bb55 #8a4418!important}
#b-interact .lab{right:auto!important;left:50%!important;top:-30px!important;transform:translateX(-50%)!important}
#b-fire2{position:absolute;left:calc(14px + var(--sal));top:42%;width:58px;height:58px;background:rgba(200,64,48,.45);border-color:rgba(255,160,140,.6);pointer-events:auto}
#b-fire2 img{width:30px;height:30px}
body:not(.touch) #pad,body:not(.touch) #b-fire2{display:none}
body:not(.touch) #ammo{left:auto;right:calc(18px + var(--sar));bottom:calc(16px + var(--sab))}
body.building #pad .ab:not(#b-fire),body.building #b-fire2,body.building #ammo,body.building #prompt{display:none}
body.building #pad{bottom:calc(150px + var(--sab))}
#hotbar{bottom:calc(8px + var(--sab))}
@media (max-height:430px){ #b-fire{width:74px!important;height:74px!important} #pad{transform:scale(.92);transform-origin:bottom right} }
/* ---------------- comic skin (bright cel-shaded look) ---------------- */
:root{--ink:#120c10;--amber:#ffc928;--orange:#ff8a1e;--red:#ff4a3a;--green:#86e64a;--cyan:#36d2ff;--panel:rgba(28,22,34,.95);--panel2:#2e2638;--panel3:#241d2c;--line:#120c10;--text:#fff6e2;--dim:#c4b8d0}
html,body{font-family:"Avenir Next Condensed","Futura-CondensedExtraBold","Roboto Condensed","Arial Narrow","Arial Black",-apple-system,system-ui,sans-serif;font-weight:600}
button{border:3px solid var(--ink);border-bottom-width:5px;border-radius:7px;background:#3a3046;color:var(--text);box-shadow:2px 2px 0 var(--ink);font-weight:800;letter-spacing:.3px}
button.primary{background:linear-gradient(#ffe45a 0 45%,#ffb21e 45%);border-color:var(--ink);color:var(--ink)}
button.danger{background:#e2433a;border-color:var(--ink)}
.c-common{color:#fff6e2}.c-uncommon{color:#86e64a}.c-rare{color:#36b8ff}.c-epic{color:#c86bff}.c-legendary{color:#ffa21e}
#status{background:rgba(28,22,34,.78);border:3px solid var(--ink);border-radius:6px;box-shadow:4px 4px 0 var(--ink);transform:skewX(-5deg)}
.bar .tr{height:14px;border:2px solid var(--ink);border-radius:2px;background:#3a3046}
#bar-hp .tr i{background:linear-gradient(#ff9c80 0 38%,#ff3a2c 38%)}#bar-food .tr i{background:linear-gradient(#ffd878 0 38%,#ff941a 38%)}#bar-water .tr i{background:linear-gradient(#9cf0ff 0 38%,#1eb4f0 38%)}
.bar .tr b{font-size:10.5px;line-height:11px;text-shadow:-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),1px 1px 0 var(--ink)}
.st{border:2px solid var(--ink);border-radius:3px;font-weight:900}
#clock{background:var(--amber);color:var(--ink);border:3px solid var(--ink);border-radius:5px;box-shadow:3px 3px 0 var(--ink);text-shadow:none;transform:skewX(-8deg);font-size:14px}
#tut{background:linear-gradient(#fff2a8 0 40%,#ffd23a 40%);border:3px solid var(--ink);border-radius:5px;box-shadow:4px 4px 0 var(--ink);font-weight:700}
#minimap{border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.sb{background:rgba(40,32,50,.86);border:3px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink)}
.ab{background:rgba(40,32,50,.8);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.ab.down{background:var(--amber)}
#hotbar{background:none}
.hs{background:rgba(40,32,50,.86);border:3px solid var(--ink);border-radius:6px;box-shadow:2px 2px 0 var(--ink)}
.hs.sel{background:var(--amber);border-color:var(--ink);box-shadow:0 0 0 2px var(--amber),3px 3px 0 2px var(--ink);transform:translateY(-3px)}
.hs.sel u{color:var(--ink)}
.hs b,.slot b{text-shadow:-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),1px 1px 0 var(--ink)}
.toast{background:#fff6dc;color:var(--ink);border:3px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--ink);font-weight:800}
.toast.bad{background:#ff5a48;color:#fff;border-color:var(--ink)}.toast.good{background:#8fe85a;color:var(--ink);border-color:var(--ink)}
.kf{background:#e2433a;border:2px solid var(--ink);border-radius:3px;box-shadow:2px 2px 0 var(--ink)}
.chatl{background:rgba(28,22,34,.7);border-left:3px solid var(--amber)}
#banner b{color:var(--amber);font-style:italic;letter-spacing:6px;-webkit-text-stroke:2px var(--ink);text-shadow:5px 5px 0 var(--ink)}
#banner small{color:#fff;text-shadow:2px 2px 0 var(--ink)}
#prog{border:3px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--ink)}#prog i{background:linear-gradient(#fff07a 0 40%,#ffaa1e 40%)}
#hurt{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(255,40,30,.6) 100%)}
.sheet{border:3px solid var(--ink);border-radius:8px;box-shadow:6px 6px 0 var(--ink)}
.sh-head{background:var(--amber);border-bottom:3px solid var(--ink)}
.sh-head>b{color:var(--ink);font-style:italic;font-weight:900}
.sh-head .tabs button.on,.cats button.on,.bcats button.on,.bi.on,.tiers button.on{background:var(--orange);border-color:var(--ink);color:var(--ink)}
.slot{background:#2e2638;border:2px solid var(--ink);border-radius:5px}
.slot.empty{background:#221c2a;border-style:solid;border-color:#4a3e58}
.slot.c-uncommon{box-shadow:inset 0 -4px 0 #86e64a}.slot.c-rare{box-shadow:inset 0 -4px 0 #36b8ff}.slot.c-epic{box-shadow:inset 0 -4px 0 #c86bff}.slot.c-legendary{box-shadow:inset 0 -4px 0 #ffa21e}
.detail,.rec,.perk,.help{border:2px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink)}
#buildbar{border-top:3px solid var(--ink)}
.logo h1{color:var(--amber);font-style:italic;-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--ink),0 0 40px rgba(255,160,40,.45)}
.logo p{color:#fff;text-shadow:2px 2px 0 var(--ink)}
#menu h2,#death h2{color:var(--amber);font-style:italic;text-shadow:3px 3px 0 var(--ink)}
#xhair i{background:#fff;box-shadow:0 0 0 1px var(--ink)}
#prompt{background:var(--amber)!important;color:var(--ink)!important;border:3px solid var(--ink)!important;border-radius:4px!important;box-shadow:3px 3px 0 var(--ink)}
#ammo b{color:#fff;text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),3px 4px 0 var(--ink)}
#ammo small,#ammo i{color:#fff;text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink)}
#ammo.low b{color:#ff6a4a}
#b-fire{background:rgba(255,74,58,.6)!important;border-color:var(--ink)!important}#b-fire.down{background:rgba(255,120,60,.9)!important}
#b-fire2{background:rgba(255,74,58,.5);border:3px solid var(--ink)}
#b-interact{background:rgba(255,138,30,.9)!important;border-color:var(--ink)!important}
#b-interact .lab{background:var(--amber);color:var(--ink);border:2px solid var(--ink)}
#b-ads.on,#b-crouch.on{background:var(--amber);border-color:var(--ink)}
#pad .ab .gl{color:#fff;text-shadow:2px 2px 0 var(--ink)}
</style>
</head>
<body>
<canvas id="view"></canvas>

  <div id="status">
    <div class="bar" id="bar-hp"><img alt=""><div class="tr"><i></i><b></b></div></div>
    <div class="bar" id="bar-food"><img alt=""><div class="tr"><i></i><b></b></div></div>
    <div class="bar" id="bar-water"><img alt=""><div class="tr"><i></i><b></b></div></div>
    <div id="chips"></div>
  </div>
  <div id="topc"><div id="clock"></div><div id="tut"></div></div>
  <div id="topr">
    <div class="col"><button class="sb" id="b-build" title="Build (B)"><img alt=""></button><button class="sb" id="b-bag" title="Inventory (Tab)"><img alt=""></button><button class="sb" id="b-craft" title="Craft (Q)"><img alt=""></button></div>
    <div class="col"><canvas id="minimap" width="208" height="208"></canvas><div style="display:flex;gap:5px;justify-content:center"><button class="sb" id="b-map" title="Map (M)"><img alt=""></button><button class="sb" id="b-pause" title="Pause (Esc)"><img alt=""></button></div></div>
  </div>
  <div id="xhair"><i class="l"></i><i class="r"></i><i class="t"></i><i class="b"></i><i class="dot"></i><i class="hm"></i></div>
  <div id="prompt" class="hidden"></div>
  <div id="killfeed"></div>
  <div id="chatlog"></div>
  <div id="ammo"></div>
  <div id="pad">
    <button class="ab big" id="b-fire"><img alt=""></button>
    <button class="ab" id="b-ads"><img alt=""></button>
    <button class="ab" id="b-jump"><span class="gl">⤒</span></button>

</div>
