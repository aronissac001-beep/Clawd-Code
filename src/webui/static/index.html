<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawd Code</title>
<style>
:root {
  --bg: #1a1915;
  --bg-raised: #232220;
  --bg-input: #2a2926;
  --border: #38362f;
  --text: #eceae4;
  --text-dim: #a5a196;
  --text-faint: #6f6b62;
  --accent: #d4a27f;
  --accent-dim: #8a6a52;
  --user: #2f3d42;
  --tool: #26251f;
  --ok: #7fb069;
  --warn: #e0a458;
  --err: #d97757;
  --radius: 10px;
  --mono: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #faf9f5; --bg-raised: #fff; --bg-input: #f0eee7; --border: #ddd9cd;
    --text: #23221e; --text-dim: #5f5c54; --text-faint: #918d83;
    --accent: #b8703f; --accent-dim: #d9b99e; --user: #e6eef1; --tool: #f3f1ea;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex; overflow: hidden;
}

/* ---------- sidebar ---------- */
#sidebar {
  width: 270px; flex: 0 0 270px; background: var(--bg-raised);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  overflow-y: auto;
}
#brand {
  padding: 16px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
#brand .logo { font-size: 20px; }
#brand h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
#brand .sub { font-size: 11px; color: var(--text-faint); margin-top: 1px; }

.group { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.group h2 {
  font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--text-faint); margin: 0 0 10px; font-weight: 600;
}
.row { display: flex; justify-content: space-between; align-items: baseline;
       font-size: 12.5px; padding: 3px 0; gap: 8px; }
.row .k { color: var(--text-dim); }
.row .v { color: var(--text); font-family: var(--mono); font-size: 11.5px;
          text-align: right; word-break: break-all; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 20px;
        font-size: 10.5px; font-family: var(--mono); }
.pill.ok   { background: rgba(127,176,105,.16); color: var(--ok); }
.pill.warn { background: rgba(224,164,88,.16);  color: var(--warn); }
.pill.err  { background: rgba(217,119,87,.16);  color: var(--err); }

select, button, textarea { font-family: inherit; color: var(--text); }
select {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 7px; padding: 7px 9px; font-size: 13px; cursor: pointer;
}
select:focus { outline: 2px solid var(--accent-dim); outline-offset: 0; }
.btn {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 7px; padding: 8px 10px; font-size: 13px; cursor: pointer;
  margin-top: 8px; transition: background .12s, border-color .12s;
}
.btn:hover:not(:disabled) { background: var(--border); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.accent { border-color: var(--accent-dim); color: var(--accent); }
.btn.danger { border-color: rgba(217,119,87,.4); color: var(--err); }
.hint { font-size: 11px; color: var(--text-faint); margin-top: 7px; line-height: 1.45; }

/* ---------- main ---------- */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#chat { flex: 1; overflow-y: auto; padding: 26px 0 10px; scroll-behavior: smooth; }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 26px; }

.msg { margin-bottom: 22px; }
.msg .who {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--text-faint); margin-bottom: 6px; font-weight: 600;
}
.msg.user .body {
  background: var(--user); border-radius: var(--radius);
  padding: 11px 15px; white-space: pre-wrap; word-wrap: break-word;
}
.msg.assistant .body { word-wrap: break-word; }
.msg.error .body {
  background: rgba(217,119,87,.1); border: 1px solid rgba(217,119,87,.35);
  border-radius: var(--radius); padding: 11px 15px; color: var(--err);
  font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap;
}

.body p { margin: 0 0 11px; }
.body p:last-child { margin-bottom: 0; }
.body ul, .body ol { margin: 0 0 11px; padding-left: 22px; }
.body li { margin: 3px 0; }
.body h1, .body h2, .body h3 { margin: 18px 0 9px; line-height: 1.3; }
.body h1 { font-size: 19px; } .body h2 { font-size: 16.5px; } .body h3 { font-size: 14.5px; }
.body code {
  background: var(--bg-input); padding: 1.5px 5px; border-radius: 4px;
  font-family: var(--mono); font-size: 12.5px;
}
.body pre {
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0 0 12px;
}
.body pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
.body strong { font-weight: 650; }

/* tool cards */
.tool {
  background: var(--tool); border: 1px solid var(--border);
  border-radius: 8px; margin: 9px 0; overflow: hidden; font-size: 13px;
}
.tool summary {
  padding: 8px 13px; cursor: pointer; display: flex; align-items: center;
  gap: 9px; list-style: none; user-select: none;
}
.tool summary::-webkit-details-marker { display: none; }
.tool .icon { font-size: 12px; opacity: .75; }
.tool .tname { font-family: var(--mono); font-size: 12.5px; color: var(--accent); }
.tool .targ {
  font-family: var(--mono); font-size: 11.5px; color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
}
.tool .tstate { font-size: 10.5px; color: var(--text-faint); }
.tool .out {
  border-top: 1px solid var(--border); padding: 10px 13px;
  font-family: var(--mono); font-size: 11.5px; color: var(--text-dim);
  white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow-y: auto;
}
.tool.err { border-color: rgba(217,119,87,.4); }
.tool.err .tname { color: var(--err); }

.cursor {
  display: inline-block; width: 7px; height: 15px; background: var(--accent);
  vertical-align: text-bottom; animation: blink 1.1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.meta {
  font-size: 11px; color: var(--text-faint); margin-top: 9px;
  font-family: var(--mono); display: flex; gap: 14px; flex-wrap: wrap;
}

/* ---------- composer ---------- */
#composer { border-top: 1px solid var(--border); background: var(--bg-raised); padding: 14px 0 16px; }
#composer .wrap { display: flex; gap: 10px; align-items: flex-end; }
#input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 11px 14px; font-size: 14.5px;
  resize: none; max-height: 220px; min-height: 46px; line-height: 1.5;
}
#input:focus { outline: 2px solid var(--accent-dim); outline-offset: -1px; }
#send {
  background: var(--accent); color: #1a1915; border: none; border-radius: var(--radius);
  padding: 0 20px; height: 46px; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: opacity .12s;
}
#send:disabled { opacity: .4; cursor: not-allowed; }
#stop {
  background: var(--bg-input); color: var(--err);
  border: 1px solid rgba(217,119,87,.45); border-radius: var(--radius);
  padding: 0 18px; height: 46px; font-size: 14px; font-weight: 600; cursor: pointer;
}
#stop:hover { background: rgba(217,119,87,.12); }
#composer .foot {
  max-width: 780px; margin: 7px auto 0; padding: 0 26px;
  font-size: 11px; color: var(--text-faint); display: flex; justify-content: space-between;
}

#empty { text-align: center; color: var(--text-faint); padding: 70px 24px; }
#empty .big { font-size: 34px; margin-bottom: 12px; }
#empty h2 { font-size: 17px; color: var(--text-dim); margin: 0 0 8px; font-weight: 500; }
#empty p { font-size: 13px; margin: 4px 0; }

@media (max-width: 820px) {
  #sidebar { display: none; }
}
</style>
</head>
<body>

<aside id="sidebar">
  <div id="brand">
    <span class="logo">🦞</span>
    <div>
      <h1>Clawd Code</h1>
      <div class="sub" id="brand-sub">local</div>
    </div>
  </div>

  <div class="group">
    <h2>Status</h2>
    <div class="row"><span class="k">Model</span><span class="v" id="s-model">–</span></div>
    <div class="row"><span class="k">Loaded</span><span class="v" id="s-loaded">–</span></div>
    <div class="row"><span class="k">GPU free</span><span class="v" id="s-vram">–</span></div>
    <div class="row"><span class="k">Folder</span><span class="v" id="s-ws">–</span></div>
  </div>

  <div class="group">
    <h2>Speed &amp; memory</h2>
    <select id="sel-profile" title="Resource profile"></select>
    <div class="hint" id="profile-hint">How much of your machine to use.</div>
  </div>

  <div class="group">
    <h2>Model</h2>
    <select id="sel-tier" title="Which model answers"></select>
    <div class="hint" id="tier-hint"></div>
  </div>

  <div class="group">
    <h2>Cloud</h2>
    <div class="row"><span class="k">Policy</span><span class="v" id="s-policy">–</span></div>
    <div class="row"><span class="k">Cost</span><span class="v" id="s-cost">–</span></div>
    <button class="btn accent" id="btn-cloud">Use cloud for next message</button>
    <select id="sel-cost" style="margin-top:8px">
      <option value="free_only">Free models only</option>
      <option value="mixed">Allow paid models</option>
    </select>
    <div class="hint" id="cost-hint"></div>
  </div>

  <div class="group">
    <button class="btn danger" id="btn-reset">New chat</button>
  </div>
</aside>

<main id="main">
  <div id="chat">
    <div class="wrap" id="messages">
      <div id="empty">
        <div class="big">🦞</div>
        <h2>Ready when you are</h2>
        <p>Ask a question, or tell it what to change.</p>
        <p>It can read and edit files in your folder.</p>
      </div>
    </div>
  </div>

  <div id="composer">
    <div class="wrap">
      <textarea id="input" rows="1" placeholder="Ask anything, or describe a change…"></textarea>
      <button id="send">Send</button>
      <button id="stop" style="display:none">Stop</button>
    </div>
    <div class="foot">
      <span>Enter to send · Shift+Enter for a new line</span>
      <span id="foot-right"></span>
    </div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const messages = $('#messages');
let busy = false, status = {}, controller = null;

/* ---------- tiny markdown renderer (no CDN; must work offline) ---------- */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function md(src) {
  const blocks = [];
  // Pull fenced code out first so its contents are never treated as markdown.
  let t = String(src).replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push(`<pre><code>${esc(code.replace(/\n$/,''))}</code></pre>`);
    return `␀${blocks.length - 1}␀`;
  });
  t = esc(t);
  t = t.replace(/`([^`\n]+)`/g, (_, c) => `<code>${c}</code>`);
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/^### (.+)$/gm, '<h3>$1</h3>')
       .replace(/^## (.+)$/gm,  '<h2>$1</h2>')
       .replace(/^# (.+)$/gm,   '<h1>$1</h1>');
  // Lists: group consecutive bullets into one <ul>.
  t = t.replace(/(?:^[-*] .+$\n?)+/gm, m =>
    '<ul>' + m.trim().split('\n').map(l => `<li>${l.replace(/^[-*] /,'')}</li>`).join('') + '</ul>');
  t = t.replace(/(?:^\d+\. .+$\n?)+/gm, m =>
    '<ol>' + m.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /,'')}</li>`).join('') + '</ol>');
  t = t.split(/\n{2,}/).map(p => {
    const s = p.trim();
    if (!s) return '';
    if (/^<(h[123]|ul|ol|pre|␀)/.test(s)) return s;
    return `<p>${s.replace(/\n/g,'<br>')}</p>`;
  }).join('');
  return t.replace(/␀(\d+)␀/g, (_, i) => blocks[+i]);
}

/* ---------- message elements ---------- */
function clearEmpty() { const e = $('#empty'); if (e) e.remove(); }

function addMessage(role, text) {
  clearEmpty();
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  const who = role === 'user' ? 'You' : role === 'error' ? 'Error' : 'Clawd';
  el.innerHTML = `<div class="who">${who}</div><div class="body"></div>`;
  el.querySelector('.body').innerHTML = role === 'assistant' ? md(text) : esc(text);
  messages.appendChild(el);
  scroll();
  return el;
}

function addToolCard(name, input, before) {
  const d = document.createElement('details');
  d.className = 'tool';
  let arg = '';
  try {
    const v = input && typeof input === 'object' ? Object.values(input)[0] : input;
    arg = v == null ? '' : String(v);
  } catch (e) { arg = ''; }
  if (arg.length > 90) arg = arg.slice(0, 90) + '…';
  d.innerHTML =
    `<summary><span class="icon">▸</span>` +
    `<span class="tname">${esc(name)}</span>` +
    `<span class="targ">${esc(arg)}</span>` +
    `<span class="tstate">running…</span></summary>`;
  // Tool calls happen before the answer, so they belong above it. Without the
  // anchor they land after the assistant bubble and read out of order.
  if (before && before.parentNode === messages) messages.insertBefore(d, before);
  else messages.appendChild(d);
  scroll();
  return d;
}

function scroll() {
  const c = $('#chat');
  // Only auto-scroll when already near the bottom, so reading isn't hijacked.
  if (c.scrollHeight - c.scrollTop - c.clientHeight < 220) c.scrollTop = c.scrollHeight;
}

/* ---------- chat ---------- */
async function send() {
  const input = $('#input');
  const text = input.value.trim();
  if (!text || busy) return;

  addMessage('user', text);
  input.value = ''; input.style.height = 'auto';
  setBusy(true);

  const el = addMessage('assistant', '');
  const body = el.querySelector('.body');
  const cur = document.createElement('span');
  cur.className = 'cursor';
  body.appendChild(cur);

  let acc = '';
  const openTools = new Map();

  try {
    controller = new AbortController();
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error(await res.text());

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.replace(/^data: /, '').trim();
        if (!line) continue;
        let ev;
        try { ev = JSON.parse(line); } catch (e) { continue; }

        if (ev.type === 'text') {
          acc += ev.data;
          body.innerHTML = md(acc);
          body.appendChild(cur);
          scroll();
        } else if (ev.type === 'tool') {
          // The loop emits tool_use when a call starts, then tool_result or
          // tool_error when it finishes.
          if (ev.kind === 'tool_use') {
            openTools.set(ev.name, addToolCard(ev.name, ev.input, el));
          } else {
            const card = openTools.get(ev.name) || addToolCard(ev.name, ev.input, el);
            const st = card.querySelector('.tstate');
            if (ev.is_error) { card.classList.add('err'); st.textContent = 'failed'; }
            else st.textContent = 'done';
            if (ev.output != null && String(ev.output).length) {
              const out = document.createElement('div');
              out.className = 'out';
              out.textContent = String(ev.output);
              card.appendChild(out);
            }
            openTools.delete(ev.name);
          }
        } else if (ev.type === 'done') {
          cur.remove();
          if (!acc && ev.text) body.innerHTML = md(ev.text);
          const u = ev.usage || {};
          const bits = [];
          if (ev.route) bits.push(ev.route.target);
          if (ev.turns) bits.push(`${ev.turns} turn${ev.turns > 1 ? 's' : ''}`);
          if (u.input_tokens) bits.push(`${u.input_tokens} in / ${u.output_tokens || 0} out`);
          if (bits.length) {
            const m = document.createElement('div');
            m.className = 'meta';
            bits.forEach(b => { const s = document.createElement('span'); s.textContent = b; m.appendChild(s); });
            el.appendChild(m);
          }
        } else if (ev.type === 'stopped') {
          cur.remove();
          const m = document.createElement('div');
          m.className = 'meta';
          m.textContent = 'stopped';
          el.appendChild(m);
          if (!acc) body.innerHTML = '<em style="color:var(--text-faint)">Stopped.</em>';
        } else if (ev.type === 'error') {
          cur.remove();
          if (!acc) el.remove();
          addMessage('error', ev.data);
        }
      }
    }
  } catch (err) {
    cur.remove();
    if (err && err.name === 'AbortError') {
      // The model call already in flight cannot be interrupted, but the loop
      // stops at the next turn. Hand control back now rather than block.
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = 'stopped — any reply already generating is discarded';
      el.appendChild(m);
      if (!acc) body.innerHTML = '<em style="color:var(--text-faint)">Stopped.</em>';
    } else {
      if (!acc) el.remove();
      addMessage('error', String(err.message || err));
    }
  } finally {
    cur.remove();
    controller = null;
    setBusy(false);
    refresh();
  }
}

function setBusy(v) {
  busy = v;
  $('#send').disabled = v;
  $('#send').style.display = v ? 'none' : '';
  $('#stop').style.display = v ? '' : 'none';
  $('#stop').disabled = false;
  $('#stop').textContent = 'Stop';
  $('#input').disabled = v;
  if (!v) $('#input').focus();
}

/* ---------- status ---------- */
async function refresh() {
  try {
    const r = await fetch('/api/status');
    status = await r.json();
  } catch (e) { return; }

  $('#brand-sub').textContent = status.provider || 'local';
  $('#s-ws').textContent = (status.workspace || '').split(/[\\/]/).pop() || '–';

  const vram = status.vram_free_mb;
  $('#s-vram').textContent = vram == null ? 'n/a' : (vram / 1024).toFixed(1) + ' GB';

  const servers = (status.ladder && status.ladder.servers) || [];
  $('#s-loaded').textContent = servers.length
    ? servers.map(s => s.tier).join(', ')
    : 'nothing yet';

  const roles = status.roles || {};
  $('#s-model').textContent = roles.main || status.provider || '–';

  // profiles
  const sp = $('#sel-profile');
  if (status.profiles && sp.options.length !== status.profiles.length) {
    sp.innerHTML = status.profiles.map(p => `<option value="${p}">${p}</option>`).join('');
  }
  if (status.profile) sp.value = status.profile;
  const hints = {
    battery: 'Unplugged — small model, low power.',
    balanced: 'Plugged in, still usable for other things.',
    max: 'All-out. Expect fan noise.',
    cpu_only: 'Leaves the GPU free for other apps.',
  };
  $('#profile-hint').textContent = hints[sp.value] || '';

  // tiers
  const st = $('#sel-tier');
  const tiers = status.tiers || [];
  if (tiers.length && st.options.length !== tiers.length + 1) {
    st.innerHTML = '<option value="">Automatic</option>' +
      tiers.map(t => `<option value="${t.name}">${t.name}</option>`).join('');
  }
  const pinned = status.ladder && status.ladder.router && status.ladder.router.pinned_tier;
  st.value = pinned || '';
  const tierHints = {
    '': 'Picks the right model for each request.',
    reflex: 'Smallest and slowest here — it runs on the CPU.',
    workhorse: 'The everyday model. Fast, good at tools.',
    deep: 'Biggest. Slower to load, better at long tasks.',
  };
  $('#tier-hint').textContent = tierHints[st.value] || '';

  // cloud
  const cloud = status.cloud || {};
  $('#s-policy').textContent = cloud.policy || '–';
  $('#s-cost').textContent = cloud.free_only ? 'free only' : (cloud.cost_mode || '–');
  if (cloud.cost_mode) $('#sel-cost').value = cloud.cost_mode;
  $('#cost-hint').textContent = cloud.free_only
    ? 'Verified free models only. This cannot cost money.'
    : 'Paid models allowed. This spends real money.';
  $('#cost-hint').style.color = cloud.free_only ? '' : 'var(--warn)';
  $('#btn-cloud').disabled = !status.ladder || cloud.policy === 'off';
  $('#foot-right').textContent = cloud.free_only ? 'free' : '';
}

/* ---------- wiring ---------- */
$('#send').addEventListener('click', send);
$('#stop').addEventListener('click', async () => {
  $('#stop').disabled = true;
  $('#stop').textContent = 'Stopping…';
  // Two halves: tell the server to stop at the next turn boundary, and abort
  // the stream so the user gets control back immediately rather than waiting
  // for a generation already in flight to finish.
  fetch('/api/stop', { method: 'POST' }).catch(() => {});
  if (controller) controller.abort();
});
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('#input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 220) + 'px';
});

async function post(url, body) {
  const r = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  if (!r.ok) { addMessage('error', (await r.text()) || 'request failed'); return null; }
  return r.json();
}

$('#sel-profile').addEventListener('change', async e => {
  await post('/api/profile', { name: e.target.value }); refresh();
});
$('#sel-tier').addEventListener('change', async e => {
  await post('/api/tier', { name: e.target.value || null }); refresh();
});
$('#sel-cost').addEventListener('change', async e => {
  if (e.target.value === 'mixed' &&
      !confirm('Allow paid models?\n\nThis spends real money. You will be asked once more before the first paid request.')) {
    e.target.value = 'free_only'; return;
  }
  await post('/api/costmode', { mode: e.target.value }); refresh();
});
$('#btn-cloud').addEventListener('click', async () => {
  const r = await post('/api/cloud', { arm: true });
  if (r) {
    const c = status.cloud || {};
    addMessage('assistant',
      `Your next message will go to **${c.model || 'the cloud model'}**.` +
      (c.free_only ? '\n\nCost mode is free-only, so this cannot cost money.'
                   : '\n\n**This will spend money.**'));
  }
});
$('#btn-reset').addEventListener('click', async () => {
  await post('/api/reset');
  messages.innerHTML = `<div id="empty"><div class="big">🦞</div>
    <h2>Ready when you are</h2><p>Ask a question, or tell it what to change.</p></div>`;
  refresh();
});

refresh();
setInterval(() => { if (!busy) refresh(); }, 4000);
$('#input').focus();
</script>
</body>
</html>
