<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spike S1 chunks</title></head>
<body style="margin:0;background:#111;color:#eee;font:16px sans-serif"><canvas id="view" width="390" height="664" style="width:390px;height:664px"></canvas>
<script>
// S1 (emulated): the chunk bands of 12.4 with their LRU sizes; scripted pan through all three
// bands with band switches. Measures bake time, live canvas memory, and counts blank chunks
// (getContext returning null, which is how iOS Safari fails past its canvas-memory cap).
const BANDS = { near: { px: 512, tiles: 8, lru: 36 }, mid: { px: 512, tiles: 16, lru: 27 }, far: { px: 256, tiles: 16, lru: 48 } };
const held = { near: new Map(), mid: new Map(), far: new Map() };
let blank = 0, bakes = 0, evictions = 0, maxBytes = 0; const bakeMs = [];
const colours = ['#5c8a3a', '#6d9a44', '#8a7a5a', '#c9b47a', '#555a66', '#3d4048'];
function bake(band, key) {
  const B = BANDS[band], c = document.createElement('canvas'); c.width = c.height = B.px;
  const g = c.getContext('2d'); if (!g) { blank++; return c; }
  const t0 = performance.now(), ts = B.px / B.tiles;
  for (let y = 0; y < B.tiles; y++) for (let x = 0; x < B.tiles; x++) {
    g.fillStyle = colours[(key * 7 + x * 3 + y * 5) % colours.length]; g.fillRect(x * ts, y * ts, ts, ts);
    g.fillStyle = 'rgba(0,0,0,0.15)'; g.fillRect(x * ts, y * ts + ts - 2, ts, 2);
    if ((x + y + key) % 5 === 0) { g.fillStyle = '#2b2e35'; g.beginPath(); g.arc(x * ts + ts / 2, y * ts + ts / 2, ts / 3, 0, 6.283); g.fill(); }
  }
  bakeMs.push(performance.now() - t0); bakes++;
  return c;
}
function bytes() { let b = 0; for (const [band, m] of Object.entries(held)) b += m.size * BANDS[band].px * BANDS[band].px * 4; return b; }
function need(band, key) {
  const m = held[band];
  if (m.has(key)) { const c = m.get(key); m.delete(key); m.set(key, c); return c; }
  const c = bake(band, key); m.set(key, c);
  while (m.size > BANDS[band].lru) { const [k, old] = m.entries().next().value; old.width = old.height = 0; m.delete(k); evictions++; }
  maxBytes = Math.max(maxBytes, bytes());
  return c;
}
function release(band) { for (const c of held[band].values()) { c.width = c.height = 0; evictions++; } held[band].clear(); }
const view = document.getElementById('view').getContext('2d');
// scripted pan: sweep the 128 map in each band (visible chunk window per band), with band switches
async function run() {
  const plan = [['near', 16, 5, 7], ['mid', 8, 4, 5], ['far', 8, 4, 6], ['mid', 8, 4, 5], ['near', 16, 5, 7]];
  for (const [band, across, vw, vh] of plan) {
    for (const other of Object.keys(held)) if (other !== band && Math.abs(Object.keys(BANDS).indexOf(other) - Object.keys(BANDS).indexOf(band)) > 1) release(other);
    for (let cy = 0; cy + vh <= across; cy += 1) for (let cx = 0; cx + vw <= across; cx += 2) {
      for (let y = cy; y < cy + vh; y++) for (let x = cx; x < cx + vw; x++) { const c = need(band, y * across + x); if (c.width) view.drawImage(c, (x - cx) * 64, (y - cy) * 64, 64, 64); }
      await new Promise(requestAnimationFrame);
    }
  }
  const s = bakeMs.slice().sort((a, b) => a - b);
  window.RESULT = { bakes, evictions, blank, maxHeldMB: +(maxBytes / 1048576).toFixed(1), bakeMedMs: +s[s.length >> 1].toFixed(2), bakeP95Ms: +s[Math.floor(s.length * 0.95)].toFixed(2), heldAtEnd: Object.fromEntries(Object.entries(held).map(([k, m]) => [k, m.size])) };
}
run().catch((e) => { window.RESULT = { error: String(e) }; });
</script></body></html>
