<!doctype html>
<!-- Shows the Embercrown app icons (D's pixel art, js/engine/art/appicon.js). Serve the repo root
     (python3 -m http.server) and open /tools/make-icons.html; tools/make-icons.mjs writes them to /icons. -->
<html><head><meta charset="utf-8"><title>Embercrown icons</title></head>
<body style="background:#222;color:#eee;font-family:sans-serif">
<div id="out"></div>
<script type="module">
import { drawAppIcon } from '../js/engine/art/appicon.js';
const out = document.getElementById('out');
for (const [s, m] of [[192, false], [512, false], [512, true], [180, false]]) {
  const c = drawAppIcon(s, m); c.style.margin = '8px'; c.style.imageRendering = 'pixelated'; out.appendChild(c);
}
</script>
</body></html>
