<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kessa">
<meta name="theme-color" content="#120d0b">
<meta name="format-detection" content="telephone=no">
<title>Kessa Colony</title>
<style>
:root {
  --bg: #120d0b; --panel: rgb(26, 19, 16); --panel2: #2a201b; --line: #4a3a30; --text: #f3e9df; --mut: #b8a597;
  --acc: #f0a25a; --acc2: #7fc8e8; --good: #8fdc8a; --bad: #ff7a6a; --warn: #f5c76a;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; overscroll-behavior: none;
  font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
body { position: fixed; inset: 0; }
#app { position: fixed; inset: 0; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; min-height: 44px; min-width: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel2); padding: 0 14px; touch-action: manipulation; cursor: pointer; }
button:active { transform: scale(.97); filter: brightness(1.25); }
button.pri { background: linear-gradient(#f6b46c, #e08c40); color: #2a1406; border-color: #ffc98f; font-weight: 650; }
button.danger { color: #ffb4ac; border-color: #7a3a32; }
button.on { border-color: var(--acc); color: #ffd6ad; background: #3a2618; }
button:disabled { opacity: .4; transform: none; filter: none; }
button.icon { font-size: 20px; padding: 0; width: 44px; }
a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 14px; border-radius: 12px; color: var(--text); text-decoration: none; border: 1px solid var(--line); background: var(--panel2); }
input[type=text], textarea, select { font: inherit; color: var(--text); background: #1b1411; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; min-height: 44px; width: 100%; -webkit-user-select: text; user-select: text; }
textarea { min-height: 120px; font: 12px/1.3 ui-monospace, Menlo, monospace; resize: vertical; word-break: break-all; }
input[type=range] { width: 100%; min-height: 44px; accent-color: var(--acc); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#top { position: absolute; top: 0; left: 0; right: 0; padding: calc(var(--sat) + 4px) calc(var(--sar) + 6px) 4px calc(var(--sal) + 6px);
  background: linear-gradient(rgba(16, 11, 9, .95), rgba(16, 11, 9, .82)); border-bottom: 1px solid #3a2d25; }
#topRow { display: flex; align-items: center; gap: 6px; }
.clock { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; line-height: 1.1; background: #1d1512; border-color: #3a2d25; padding: 0 10px; }
.clock b { font-size: 14px; } .clock span { font-size: 12px; color: var(--mut); }
#speed { display: flex; gap: 3px; }
#speed button { width: 44px; padding: 0; font-size: 12px; letter-spacing: -2px; }
#resBar { display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; margin-top: 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
#resBar::-webkit-scrollbar { display: none; }
.rc { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 52px; min-height: 44px; padding: 2px 6px; border-radius: 10px;
  background: #1d1512; border: 1px solid #33271f; font-size: 13px; line-height: 1.1; }
.rc .v { font-weight: 650; white-space: nowrap; } .rc .d { font-size: 10px; color: var(--mut); white-space: nowrap; }
.rc .d.pos { color: var(--good); } .rc .d.neg { color: var(--bad); }
.rc.warn { border-color: #8a5a20; background: #2c1d10; } .rc.crit { border-color: #9a3a2a; background: #351410; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { filter: brightness(1.4); } }
#hzBar { margin-top: 4px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
#hzBar::-webkit-scrollbar { display: none; }
.hz { flex: 0 0 auto; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #3a1c12; border: 1px solid #7a3a22; color: #ffcfae; white-space: nowrap; min-height: 28px; display: flex; align-items: center; }
.hz.active { background: #5a1a10; border-color: #ff7a4a; animation: pulse 1.6s infinite; }
#bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: 2px;
  padding: 4px calc(var(--sar) + 4px) calc(var(--sab) + 4px) calc(var(--sal) + 4px); background: linear-gradient(rgba(16, 11, 9, .82), rgba(16, 11, 9, .97)); border-top: 1px solid #3a2d25; }
.tb { flex: 1; min-width: 44px; height: 52px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; position: relative; background: transparent; border-color: transparent; }
.tb i { font-style: normal; font-size: 19px; line-height: 1; } .tb span { font-size: 10px; color: var(--mut); margin-top: 3px; }
.tb.on { background: #33241b; border-color: #5a4232; } .tb.on span { color: var(--acc); }
.pip { position: absolute; top: 4px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
#toasts { position: absolute; z-index: 9; left: 8px; right: 8px; top: calc(var(--sat) + 104px); display: flex; flex-direction: column; gap: 6px; pointer-events: none; align-items: center; }
.toast { pointer-events: auto; max-width: 100%; background: rgba(28, 20, 17, .95); border: 1px solid var(--line); border-left: 4px solid var(--acc2); border-radius: 12px;
  padding: 6px 10px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); animation: tin .25s ease-out; min-height: 36px; }
.toast.warn { border-left-color: var(--warn); } .toast.bad { border-left-color: var(--bad); } .toast.good { border-left-color: var(--good); }
@keyframes tin { from { transform: translateY(-10px); opacity: 0; } }
#tip { position: absolute; left: 10px; right: 10px; bottom: calc(var(--sab) + 70px); background: rgba(34, 24, 19, .97); border: 1px solid #8a6040; border-radius: 14px; padding: 12px 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, .5); }
#tip h4 { margin: 0 0 4px; color: var(--acc); font-size: 15px; } #tip p { margin: 0 0 8px; font-size: 14px; color: #e8dccf; }
#tip .row { display: flex; gap: 8px; justify-content: flex-end; }
#placeBar { position: absolute; left: 8px; right: 8px; bottom: calc(var(--sab) + 66px); z-index: 7; background: rgba(28, 20, 17, .97); border: 1px solid #6a4a35; border-radius: 14px; padding: 10px; box-shadow: 0 8px 30px rgba(0, 0, 0, .5); }
#placeBar .t { font-weight: 650; } #placeBar .s { font-size: 13px; color: var(--mut); margin: 2px 0 8px; } #placeBar .s.bad { color: var(--bad); }
#placeBar .row { display: flex; gap: 8px; } #placeBar .row button { flex: 1; }

/* ---------- bottom sheet ---------- */
#sheet { position: absolute; left: 0; right: 0; bottom: calc(var(--sab) + 61px); max-height: calc(66% - 40px); display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid #6a4a35;
  border-radius: 18px 18px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .5); animation: sup .2s ease-out; z-index: 5; }
#sheet.tall { max-height: calc(100% - var(--sat) - var(--sab) - 61px - 106px); height: calc(100% - var(--sat) - var(--sab) - 61px - 106px); }
#bottom { z-index: 6; }
@keyframes sup { from { transform: translateY(30px); opacity: .4; } }
.sh-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 6px 14px; border-bottom: 1px solid #3a2d25; }
.sh-head h3 { flex: 1; margin: 0; font-size: 17px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-body { overflow-y: auto; overflow-x: hidden; padding: 10px 12px 14px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 8px 10px 4px; scrollbar-width: none; flex: 0 0 auto; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 0 0 auto; font-size: 13px; padding: 0 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card { background: #221915; border: 1px solid #3c2e25; border-radius: 12px; padding: 10px; position: relative; }
.card.btn { text-align: left; display: block; width: 100%; padding: 8px 10px; min-height: 64px; }
.card.lock { opacity: .55; } .card.sel { border-color: var(--acc); background: #34241a; }
.card h5 { margin: 0 0 2px; font-size: 14px; } .card p { margin: 2px 0 0; font-size: 12px; color: var(--mut); }
.card .art { float: right; margin: -2px -2px 0 6px; }
.cost { display: flex; flex-wrap: wrap; gap: 3px 8px; font-size: 12px; margin-top: 4px; } .cost .no { color: var(--bad); }
.kv { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px dashed #3a2d25; font-size: 14px; } .kv span:first-child { color: var(--mut); }
.row { display: flex; gap: 8px; align-items: center; } .row.wrap { flex-wrap: wrap; } .row > .grow { flex: 1; }
.bar { height: 8px; background: #3a2d25; border-radius: 4px; overflow: hidden; margin: 4px 0; } .bar > i { display: block; height: 100%; background: var(--good); border-radius: 4px; }
.bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
.st { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #2e3a24; color: #c7f0b5; } .st.warn { background: #45361a; color: #ffd98a; } .st.bad { background: #4a1f18; color: #ffb2a6; }
.sec { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); }
.list .it { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #33271f; min-height: 52px; }
.list .it .grow { flex: 1; min-width: 0; } .list .it .sub { font-size: 12px; color: var(--mut); }
.list .it.tap { cursor: pointer; } .list .it.tap:active { background: #2a1f19; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid #4a3a30; margin: 1px 2px 1px 0; }
.chip.good { border-color: #4f7a45; color: #b8eaa8; } .chip.bad { border-color: #8a4036; color: #ffb3a8; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.slot { border: 1px dashed #5a4636; border-radius: 10px; min-height: 64px; padding: 6px; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #1d1512; }
.slot.full { border-style: solid; background: #2a1f18; } .slot.wip { border-color: var(--warn); } .slot b { font-size: 18px; }
.seg { display: flex; gap: 4px; } .seg button { flex: 1; padding: 0 6px; font-size: 13px; }
.mut { color: var(--mut); } .good { color: var(--good); } .bad { color: var(--bad); } .warnc { color: var(--warn); }
.small { font-size: 12px; }
.tech { display: block; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 6px; min-height: 56px; }
.tech.done { opacity: .6; border-color: #3f5a35; } .tech.cur { border-color: var(--acc); background: #3a2618; } .tech.q { border-color: #7a6040; } .tech.na { opacity: .5; }

/* ---------- full screens ---------- */
#screens { position: absolute; inset: 0; pointer-events: none; }
.screen { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 0%, #3a1f14 0%, #160f0c 55%, #0d0908 100%); pointer-events: auto; overflow-y: auto; overflow-x: hidden;
  padding: calc(var(--sat) + 12px) calc(var(--sar) + 16px) calc(var(--sab) + 20px) calc(var(--sal) + 16px); z-index: 10; }
.screen h2 { margin: 6px 0 12px; font-size: 22px; }
.screen .bar2 { display: flex; gap: 8px; margin-top: 16px; } .screen .bar2 button { flex: 1; }
.menu { display: flex; flex-direction: column; gap: 10px; max-width: 420px; margin: 0 auto; }
.menu .title { text-align: center; margin: 4px 0 2px; }
.menu .title h1 { font-size: 40px; letter-spacing: .12em; margin: 0; background: linear-gradient(#ffd7a8, #e5793a); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; }
.menu .title p { margin: 2px 0 0; color: var(--mut); font-size: 14px; letter-spacing: .25em; text-transform: uppercase; }
.menu > button { min-height: 52px; font-size: 17px; }
#menuArt { width: 100%; height: 220px; display: block; border-radius: 16px; }
.back { position: absolute; top: calc(var(--sat) + 10px); left: calc(var(--sal) + 12px); }
.pick { display: flex; flex-direction: column; gap: 6px; }
.pick button { text-align: left; padding: 8px 12px; min-height: 56px; }
.pick button p { margin: 2px 0 0; font-size: 12px; color: var(--mut); }
#modal { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.mback { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); pointer-events: auto; display: flex; align-items: center; justify-content: center; padding: 16px; }
.mbox { background: #241a15; border: 1px solid #6a4a35; border-radius: 16px; padding: 16px; width: 100%; max-width: 420px; max-height: 86%; overflow-y: auto; }
.mbox h3 { margin: 0 0 8px; } .mbox .row { margin-top: 12px; } .mbox .row button { flex: 1; }
.help h4 { color: var(--acc); margin: 16px 0 4px; } .help p, .help li { font-size: 14px; color: #e3d6c8; }
@media (min-width: 700px) {
  #sheet { left: calc(50% - 300px); right: calc(50% - 300px); border: 1px solid #6a4a35; }
  #placeBar, #tip { left: calc(50% - 280px); right: calc(50% - 280px); }
  #bottom { padding-left: calc(50% - 300px); padding-right: calc(50% - 300px); }
  #toasts { left: calc(50% - 280px); right: calc(50% - 280px); }
}

</style>
</head>
<body>
<div id="app">
  <canvas id="map" aria-label="Colony map"></canvas>
  <div id="hud" hidden>
    <div id="top">
      <div id="topRow">
        <button id="btnMenu" class="icon" aria-label="Menu">☰</button>
        <button id="clock" class="clock" aria-label="Time and hazards"><b id="clockSol">Sol 1</b><span id="clockHour">06:00</span></button>
        <div id="speed" role="group" aria-label="Speed">
          <button data-sp="0" aria-label="Pause">❚❚</button>
          <button data-sp="1" aria-label="Normal speed">▶</button>
          <button data-sp="3" aria-label="Fast">▶▶</button>
          <button data-sp="10" aria-label="Fastest">▶▶▶</button>
        </div>
      </div>
      <div id="resBar"></div>
      <div id="hzBar" hidden></div>
    </div>
    <div id="toasts"></div>
    <div id="tip" hidden></div>
    <div id="placeBar" hidden></div>
    <div id="bottom">
      <button data-tab="build" class="tb"><i>⚒</i><span>Build</span></button>
      <button data-tab="layers" class="tb"><i>◫</i><span>Layers</span></button>
      <button data-tab="people" class="tb"><i>☺</i><span>People</span></button>
      <button data-tab="research" class="tb"><i>⚛</i><span>Research</span><b class="pip" hidden></b></button>
      <button data-tab="rockets" class="tb"><i>⇧</i><span>Rockets</span></button>
      <button data-tab="log" class="tb"><i>✉</i><span>Log</span><b class="pip" hidden></b></button>
      <button data-tab="goals" class="tb"><i>★</i><span>Goals</span></button>
    </div>
    <div id="sheet" hidden></div>
  </div>
  <div id="screens"></div>
  <div id="modal"></div>
</div>
<script id="engine">
// ===== core.js : namespace, seeded RNG, noise, small helpers =====
'use strict';
var KC = {};
const KC_VERSION = '1.0.0';
const SAVE_FORMAT = 1;
const HOURS_PER_SOL = 24;

function cyrb128(str) {
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0, k; i < str.length; i++) {
    k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
  h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
  h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  h1 ^= (h2 ^ h3 ^ h4); h2 ^= h1; h3 ^= h1; h4 ^= h1;
  return [h1 >>> 0, h2 >>> 0, h3 >>> 0, h4 >>> 0];
}

// sfc32: 4 x uint32 of state, saved with the game so runs replay exactly
class RNG {
  constructor(state) { this.s = new Uint32Array(4); for (let i = 0; i < 4; i++) this.s[i] = state[i] >>> 0; }
  static fromSeed(str) { const r = new RNG(cyrb128(String(str))); for (let i = 0; i < 15; i++) r.next(); return r; }
  next() {
    const s = this.s;
    let a = s[0], b = s[1], c = s[2], d = s[3];
    let t = (a + b) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    d = (d + 1) | 0;
    t = (t + d) | 0;
    c = (c + t) | 0;
    s[0] = a; s[1] = b; s[2] = c; s[3] = d;
    return (t >>> 0) / 4294967296;
  }
  int(n) { return Math.floor(this.next() * n); }
  range(a, b) { return a + this.next() * (b - a); }
  chance(p) { return this.next() < p; }
  pick(a) { return a[this.int(a.length)]; }
  shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = this.int(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  weighted(items, wf) { let tot = 0; for (const it of items) tot += Math.max(0, wf(it)); let r = this.next() * tot; for (const it of items) { r -= Math.max(0, wf(it)); if (r <= 0) return it; } return items[items.length - 1]; }
  state() { return Array.from(this.s); }
}

// seeded 2D value noise with fractal sum
function makeNoise(rng) {
  const P = new Uint8Array(512), V = new Float32Array(256);
  const perm = []; for (let i = 0; i < 256; i++) perm.push(i);
  rng.shuffle(perm);
  for (let i = 0; i < 512; i++) P[i] = perm[i & 255];
  for (let i = 0; i < 256; i++) V[i] = rng.next() * 2 - 1;
  const sm = t => t * t * (3 - 2 * t);
  function n2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const a = V[P[(xi & 255) + P[yi & 255]]], b = V[P[((xi + 1) & 255) + P[yi & 255]]];
    const c = V[P[(xi & 255) + P[(yi + 1) & 255]]], d = V[P[((xi + 1) & 255) + P[(yi + 1) & 255]]];
    const u = sm(xf), v = sm(yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, oct = 4, lac = 2, gain = 0.5) {
    let s = 0, amp = 1, f = 1, norm = 0;
    for (let o = 0; o < oct; o++) { s += amp * n2(x * f, y * f); norm += amp; amp *= gain; f *= lac; }
    return s / norm;
  }
  function ridge(x, y, oct = 4) {
    let s = 0, amp = 1, f = 1, norm = 0;
    for (let o = 0; o < oct; o++) { s += amp * (1 - Math.abs(n2(x * f, y * f))); norm += amp; amp *= 0.5; f *= 2; }
    return s / norm;
  }
  return { n2, fbm, ridge };
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const round1 = v => Math.round(v * 10) / 10;
function cheb(ax, ay, bx, by) { return Math.max(Math.abs(ax - bx), Math.abs(ay - by)); }
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function addTo(obj, k, v) { obj[k] = (obj[k] || 0) + v; }
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
function solOf(tick) { return Math.floor(tick / HOURS_PER_SOL) + 1; }
function hourOf(tick) { return tick % HOURS_PER_SOL; }
function fmtTime(tick) { const h = hourOf(tick); return 'Sol ' + solOf(tick) + ', ' + String(h).padStart(2, '0') + ':00'; }

// ===== mapgen.js : terrain heightmap, craters, ridges, deposits, anomalies =====
const MAP_N = 64, SECTOR = 8;
const TERR = ['Dust plain', 'Rock field', 'Basalt', 'Frost flat', 'Dunes', 'Highland'];
const SLOPE_BUILD = 0.055, SLOPE_LINE = 0.11, SLOPE_DRIVE = 0.14;

// static terrain is regenerated from the seed on load, never saved
function genTerrain(seed) {
  const n = MAP_N, rng = RNG.fromSeed(seed + '/terrain'), noise = makeNoise(rng), N = n * n;
  const h = new Float32Array(N), terr = new Uint8Array(N), slope = new Float32Array(N), crater = new Float32Array(N);
  const ox = rng.range(0, 100), oy = rng.range(0, 100);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const b = noise.fbm(x / 24 + ox, y / 24 + oy, 5) * 0.55;
    const r = Math.pow(noise.ridge(x / 34 + oy, y / 34 + ox, 3), 3) * 0.55;
    h[y * n + x] = b + r;
  }
  // flatten the centre a little so there is always a landing plain
  const cx = n / 2, cy = n / 2;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const d = Math.hypot(x - cx, y - cy), f = clamp(1 - d / 13, 0, 1);
    const i = y * n + x; h[i] = h[i] * (1 - f * 0.75) + 0.3 * f * 0.75;
  }
  // craters: bowl plus raised rim
  const craters = [], nc = 9 + rng.int(6);
  for (let k = 0; k < nc; k++) {
    const r = k < 2 ? rng.range(7, 11) : rng.range(2.5, 6.5);
    let x, y, tries = 0;
    do { x = rng.range(3, n - 3); y = rng.range(3, n - 3); tries++; } while (Math.hypot(x - cx, y - cy) < r + 7 && tries < 40);
    craters.push({ x, y, r });
    const depth = 0.12 + r * 0.018;
    for (let yy = Math.max(0, Math.floor(y - r * 1.6)); yy < Math.min(n, Math.ceil(y + r * 1.6)); yy++)
      for (let xx = Math.max(0, Math.floor(x - r * 1.6)); xx < Math.min(n, Math.ceil(x + r * 1.6)); xx++) {
        const d = Math.hypot(xx - x, yy - y) / r, i = yy * n + xx;
        if (d < 1) { h[i] -= depth * (1 - d * d) * 0.9; crater[i] = Math.max(crater[i], 1 - d); }
        const rim = Math.exp(-Math.pow((d - 1.05) / 0.18, 2)) * depth * 0.55;
        h[i] += rim;
      }
  }
  let mn = Infinity, mx = -Infinity;
  for (let i = 0; i < N; i++) { mn = Math.min(mn, h[i]); mx = Math.max(mx, h[i]); }
  for (let i = 0; i < N; i++) h[i] = (h[i] - mn) / (mx - mn);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const i = y * n + x; let s = 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= n || yy >= n) continue;
      s = Math.max(s, Math.abs(h[i] - h[yy * n + xx]));
    }
    slope[i] = s;
  }
  const tn = makeNoise(RNG.fromSeed(seed + '/tex'));
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const i = y * n + x, v = tn.fbm(x / 9, y / 9, 3), w = tn.fbm(x / 5 + 40, y / 5 + 40, 2);
    let t = 0;
    if (h[i] > 0.72) t = 5;
    else if (crater[i] > 0.35 && h[i] < 0.38) t = 3;
    else if (slope[i] > 0.05) t = 1;
    else if (v > 0.28) t = 4;
    else if (w < -0.33) t = 2;
    terr[i] = t;
  }
  return { n, h, terr, slope, crater, craters };
}

// deposits, anomalies and the landing site are rolled once and saved with the game
function genFeatures(seed, T) {
  const n = T.n, rng = RNG.fromSeed(seed + '/features');
  const deps = [], anomalies = [];
  const used = new Uint8Array(n * n);
  const flatAt = (x, y, r) => { for (let yy = y - r; yy <= y + r; yy++) for (let xx = x - r; xx <= x + r; xx++) { if (xx < 1 || yy < 1 || xx >= n - 1 || yy >= n - 1) return false; if (T.slope[yy * n + xx] > SLOPE_BUILD) return false; } return true; };
  // landing site: flattest 3x3 near the centre
  let land = null, best = Infinity;
  for (let y = n / 2 - 8; y <= n / 2 + 8; y++) for (let x = n / 2 - 8; x <= n / 2 + 8; x++) {
    if (!flatAt(x, y, 2)) continue;
    const s = Math.hypot(x - n / 2, y - n / 2) + rng.next();
    if (s < best) { best = s; land = { x: x - 1, y: y - 1 }; }
  }
  if (!land) land = { x: n / 2 - 1, y: n / 2 - 1 };
  for (let yy = land.y - 2; yy < land.y + 5; yy++) for (let xx = land.x - 2; xx < land.x + 5; xx++) used[yy * n + xx] = 1;
  const lc = { x: land.x + 1, y: land.y + 1 };
  const place = (type, amt, opt = {}) => {
    for (let tries = 0; tries < 400; tries++) {
      let x, y;
      if (opt.near) { const a = rng.range(0, Math.PI * 2), d = rng.range(opt.near[0], opt.near[1]); x = Math.round(lc.x + Math.cos(a) * d); y = Math.round(lc.y + Math.sin(a) * d); }
      else { x = 2 + rng.int(n - 4); y = 2 + rng.int(n - 4); }
      if (x < 2 || y < 2 || x >= n - 2 || y >= n - 2) continue;
      const i = y * n + x;
      if (used[i]) continue;
      if (!opt.any && T.slope[i] > SLOPE_BUILD) continue;
      if (opt.minD && Math.hypot(x - lc.x, y - lc.y) < opt.minD) continue;

    e.preventDefault();

    tick(dt) {
      if (!inertia) return;
      R.cam.x -= inertia.vx * dt / R.cam.z; R.cam.y -= inertia.vy * dt / R.cam.z; R.clampCam();

function bestApplicants(G) {
  const want = { engineer: 3, scientist: 2.6, botanist: 3, geologist: 2.2, medic: 1.2, security: 1.2, none: 1.5 }, have = {};
  for (const c of G.colonists) have[c.spec] = (have[c.spec] || 0) + 1;
  const sc = a => a.traits.reduce((s, t) => s + (TRAITS[t].good ? 2 : -3), 0) + want[a.spec] / (1 + (have[a.spec] || 0) / 6) - (a.age > 50 ? 1.5 : 0);
  return G.applicants.slice().sort((a, b) => sc(b) - sc(a)).slice(0, KC.arkSize(G));
}
function drawHistory(cv, G) {
  const c = cv.getContext('2d'), W = cv.width, H = cv.height, hs = G.hist;
  c.fillStyle = '#1b1411'; c.fillRect(0, 0, W, H);
  c.strokeStyle = '#3a2d25'; c.lineWidth = 1; for (let k = 1; k < 4; k++) { c.beginPath(); c.moveTo(0, H * k / 4); c.lineTo(W, H * k / 4); c.stroke(); }
  if (hs.length < 2) { c.fillStyle = '#b8a597'; c.font = '24px sans-serif'; c.fillText('History appears after the first sols.', 20, H / 2); return; }
  const series = [[h2 => h2.pop, '#8fdc8a'], [h2 => h2.rp, '#b48cff'], [h2 => h2.funds, '#f6e27a']];
  for (const [f, col] of series) {
    const mx = Math.max(1, ...hs.map(f));
    c.strokeStyle = col; c.lineWidth = 3; c.beginPath();
    hs.forEach((x, i) => { const px = i / (hs.length - 1) * (W - 10) + 5, py = H - 8 - f(x) / mx * (H - 20); if (i) c.lineTo(px, py); else c.moveTo(px, py); });
    c.stroke();
  }
  c.fillStyle = '#8fdc8a'; c.font = 'bold 22px sans-serif'; c.fillText('peak ' + Math.max(...hs.map(x => x.pop)) + ' colonists', 12, 26);
}

  const r = KC.RNG.fromSeed('menu'); for (let i = 0; i < 90; i++) { c.fillStyle = 'rgba(255,240,220,' + r.range(0.2, 0.9) + ')'; c.fillRect(r.next() * W, r.next() * H * 0.6, 1.2, 1.2); }
  // the orange star and a small moon
  const sg = c.createRadialGradient(W * 0.78, H * 0.3, 2, W * 0.78, H * 0.3, 60); sg.addColorStop(0, 'rgba(255,230,180,1)'); sg.addColorStop(0.15, 'rgba(255,170,90,.9)'); sg.addColorStop(1, 'rgba(255,120,60,0)'); c.fillStyle = sg; c.beginPath(); c.arc(W * 0.78, H * 0.3, 60, 0, 7); c.fill();
  c.fillStyle = '#c9b8a8'; c.beginPath(); c.arc(W * 0.2, H * 0.22, 9, 0, 7); c.fill(); c.fillStyle = '#3a1c18'; c.beginPath(); c.arc(W * 0.2 + 4, H * 0.22 - 2, 8, 0, 7); c.fill();
  // ridges
  const ridge = (y0, amp, col, seed) => { const rr = KC.RNG.fromSeed(seed); c.fillStyle = col; c.beginPath(); c.moveTo(0, H); let y = y0; for (let x = 0; x <= W; x += 8) { y += rr.range(-amp, amp); y = clamp(y, y0 - amp * 4, y0 + amp * 3); c.lineTo(x, y); } c.lineTo(W, H); c.fill(); };
  ridge(H * 0.62, 4, '#5a2e20', 'r1'); ridge(H * 0.72, 3, '#41231a', 'r2'); ridge(H * 0.84, 2, '#2a1712', 'r3');
  // dome and lander silhouettes with lights
  const dx = W * 0.38, dy = H * 0.86;
  const dg = c.createRadialGradient(dx - 12, dy - 30, 4, dx, dy - 10, 60); dg.addColorStop(0, 'rgba(255,240,220,.7)'); dg.addColorStop(0.5, 'rgba(150,210,230,.35)'); dg.addColorStop(1, 'rgba(80,130,160,.5)');
  c.fillStyle = dg; c.beginPath(); c.ellipse(dx, dy, 52, 44, 0, Math.PI, 0); c.fill(); c.strokeStyle = 'rgba(255,255,255,.35)'; c.stroke();
  c.fillStyle = 'rgba(255,200,120,.8)'; for (let k = 0; k < 6; k++) c.fillRect(dx - 30 + k * 11, dy - 8 - (k % 2) * 6, 4, 3);
  c.fillStyle = '#1e120e'; c.fillRect(W * 0.62, dy - 30, 6, 30); c.beginPath(); c.moveTo(W * 0.6, dy - 30); c.lineTo(W * 0.625, dy - 46); c.lineTo(W * 0.65, dy - 30); c.fill();
  c.fillStyle = '#ff5a3a'; c.beginPath(); c.arc(W * 0.625, dy - 48, 2, 0, 7); c.fill();
  // dust haze
  const hz = c.createLinearGradient(0, H * 0.55, 0, H); hz.addColorStop(0, 'rgba(200,120,70,0)'); hz.addColorStop(1, 'rgba(200,120,70,.18)'); c.fillStyle = hz; c.fillRect(0, 0, W, H);
}

// ===== tips.js : first-game tutorial cards driven by colony state =====
const TIPS = [
  { id: 'welcome', title: 'Welcome to Kessa', text: 'Your lander is down. Drag to look around, pinch to zoom, tap anything to inspect it. Time is running: use the buttons at the top to pause or speed up.', done: () => false, manual: true },
  { id: 'solar', title: 'Power first', text: 'Open Build → Power and place two Solar Arrays touching the lander. Buildings that touch share power.', done: G => G.buildings.filter(b => b.t === 'solar').length >= 2 },
  { id: 'battery', title: 'Survive the night', text: 'Solar makes nothing at night. Add a Battery Bank next to your arrays.', done: G => G.buildings.some(b => b.t === 'battery') },
  { id: 'sinter', title: 'Building blocks', text: 'Domes need sinter. Place a Regolith Sinterer (Build → Industry) over the tan fine-regolith deposit near the lander. Drones collect the grey metal scatter by themselves.', done: G => G.buildings.some(b => b.t === 'sinterer') },
  { id: 'water', title: 'Water and air', text: 'Use your prefabs: an Ice Drill on the pale blue ice deposit and an Air Synthesizer by the base (Build → Life support). Link a far drill with Life Pipe and Power Cable.', done: G => G.buildings.some(b => b.t === 'icedrill') && G.buildings.some(b => b.t === 'airsynth') },
  { id: 'tanks', title: 'Storage', text: 'Add a Water Tank and an Air Tank touching your network so colonists have a buffer.', done: G => G.buildings.some(b => b.t === 'watertank') && G.buildings.some(b => b.t === 'airtank') },
  { id: 'dome', title: 'A home under glass', text: 'Place a Bubble Dome (Build → Domes) touching the base, so it shares power and pipes.', done: G => G.buildings.some(b => b.t === 'dome_s') },
  { id: 'modules', title: 'Fill the dome', text: 'When the dome is finished, tap it and add Living Quarters, a Canteen and Hydroponics.', done: G => G.buildings.some(b => b.t === 'quarters') && G.buildings.some(b => b.t === 'hydro') },
  { id: 'research', title: 'Research', text: 'Open Research and choose a technology. Labs and scientists speed this up later.', done: G => !!G.research.cur || G.research.queue.length > 0 },
  { id: 'ark', title: 'Bring people', text: 'Once the dome has homes, power, water and oxygen, open Rockets → Colonists, tap Pick best, add some food in Cargo, and Launch.', done: G => G.st.everColonists || G.rockets.some(r => r.ark.length) },
  { id: 'jobs', title: 'Work and shifts', text: 'Colonists work in buildings near their dome. Build a Machine Works and an Ore Extractor so you make your own parts and metals. Watch the badges over buildings for problems.', done: G => G.buildings.some(b => b.t === 'works') },
  { id: 'goal', title: 'The long game', text: 'Open Goals to see what Independence needs. Expand with more domes, labs and industry, and keep an eye on the hazard warnings. Good luck, Commander.', done: () => false, manual: true },
];
const Tips = {
  reset() { this.shown = null; this.check(); },
  check() {
    const G = UI.G, el = $('#tip');
    if (!G || !Settings.get('tips') || G.over) { el.hidden = true; return; }
    const doneList = Settings.get('tipsDone') || [];
    for (const t of TIPS) if (!doneList.includes(t.id) && t.done(G)) doneList.push(t.id);
    const next = TIPS.find(t => !doneList.includes(t.id));
    Settings.data.tipsDone = doneList;
    if (!next || UI.mode || !$('#sheet').hidden || Modal.open || $('#screens').children.length) { el.hidden = true; this.shown = null; return; }
    if (this.shown === next.id && !el.hidden) return;
    this.shown = next.id; el.hidden = false; el.innerHTML = '';
    el.appendChild(h('h4', null, next.title)); el.appendChild(h('p', null, next.text));
    el.appendChild(h('div', { class: 'row' }, h('button', { onclick: () => { Settings.set('tips', false); el.hidden = true; } }, 'Hide tips'), h('button', { class: 'pri', onclick: () => { doneList.push(next.id); Settings.set('tipsDone', doneList); this.shown = null; Sound.play('tap'); this.check(); } }, next.manual ? 'Got it' : 'Skip')));
  },
};

// ===== main.js : boot and wiring of HUD buttons =====
(function boot() {
  R.init($('#map'));
  UI.input = attachInput($('#map'), { tap: (x, y) => UI.tap(x, y) });
  $$('#speed button').forEach(b => b.addEventListener('click', () => { Sound.unlock(); UI.setSpeed(+b.dataset.sp); Sound.play('tap'); }));
  $('#btnMenu').addEventListener('click', () => { Sound.unlock(); Panels.gameMenu(); });
  $('#clock').addEventListener('click', () => { Sound.unlock(); UI.togglePause(); });
  const tabs = { build: () => Panels.build(), layers: () => Panels.layers(), people: () => Panels.people(), research: () => Panels.research(), rockets: () => Panels.rockets(), log: () => Panels.log(), goals: () => Panels.goals() };
  $$('#bottom .tb').forEach(b => b.addEventListener('click', () => {
    Sound.unlock(); Sound.play('open');
    if (UI.mode) UI.cancelMode();
    if (Sheet.cur && Sheet.cur.tab === b.dataset.tab) { Sheet.close(); return; }
    tabs[b.dataset.tab]();
  }));
  document.addEventListener('keydown', e => {
    if (!UI.G || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === ' ') { e.preventDefault(); UI.togglePause(); }
    else if (e.key === 'Escape') { if (UI.mode) UI.cancelMode(); else Sheet.close(); }
    else if (e.key === '1' || e.key === '2' || e.key === '3') UI.setSpeed([1, 3, 10][+e.key - 1]);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && UI.G && Settings.get('autosave')) Saves.write('auto', UI.G); });
  window.addEventListener('pagehide', () => { if (UI.G && Settings.get('autosave')) Saves.write('auto', UI.G); });
  document.addEventListener('pointerdown', () => Sound.unlock(), { once: true });
  Screens.main();
  requestAnimationFrame(t => UI.loop(t));
})();

</script>
