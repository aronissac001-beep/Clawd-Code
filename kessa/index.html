<!DOCTYPE html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Kessa Colony</title>
<style>
/* ===== Kessa Colony design system =====
   Basalt surfaces, dust amber for action, frost cyan for information.
   Type scale 11 / 12.5 / 14 / 15.5 / 18 / 22 / 34 · spacing 4 / 8 / 12 / 16 / 24 · radii 8 / 12 / 16 / 22 */
:root {
  /* surfaces, darkest to raised */
  --s0: #0e0b09; --s1: #18130f; --s2: #211a15; --s3: #2c231c; --s4: #3a2e25;
  --ln: #3a2f27; --ln2: #56463a;
  /* ink: primary, secondary, tertiary (all AA on --s1 and --s2) */
  --ink: #f5ede4; --ink2: #cdbcac; --ink3: #a8968a;
  /* brand */
  --amber: #f2a65a; --amber2: #ffc68a; --amber-ink: #2a1505; --amberbg: #3b2717;
  --frost: #8fd6f5; --frostbg: #15262e;
  /* signals */
  --good: #8fdc8a; --goodbg: #1c2c1b; --warn: #f5c76a; --warnbg: #34270f; --bad: #ff8070; --badbg: #3a1511;
  /* sizes */
  --t-xs: 11px; --t-sm: 12.5px; --t-md: 14px; --t-lg: 15.5px; --t-xl: 18px; --t-2xl: 22px; --t-3xl: 34px;
  --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 24px;
  --r1: 8px; --r2: 12px; --r3: 16px; --r4: 22px;
  --e1: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 1px 2px rgba(0, 0, 0, .35);
  --e2: 0 8px 24px rgba(0, 0, 0, .45);
  --e3: 0 18px 50px rgba(0, 0, 0, .6);
  --ease: cubic-bezier(.2, .8, .2, 1);
  /* kept for older inline uses */
  --bg: var(--s0); --panel: var(--s1); --panel2: var(--s3); --line: var(--ln); --text: var(--ink); --mut: var(--ink3); --acc: var(--amber); --acc2: var(--frost);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--s0); color: var(--ink); overflow: hidden; overscroll-behavior: none;
  font: 400 15px/1.38 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
body { position: fixed; inset: 0; }
#app { position: fixed; inset: 0; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
[hidden] { display: none !important; }
.num, .kv span:last-child, .rc .v, .cost, .clock b, .clock span { font-variant-numeric: tabular-nums; }

/* ---------- icons ---------- */
.ic { width: 1.25em; height: 1.25em; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.24em; }
.icv { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; } .icv .ic { width: 15px; height: 15px; }
.res-funds { color: #f6e27a; } .res-pop { color: #e8d9c8; } .res-power { color: #ffd84a; } .res-water { color: #6cc4ff; } .res-oxygen { color: #bff1ff; }
.res-food { color: #9fdc6a; } .res-metals { color: #c3ccd4; } .res-sinter { color: #d6ad84; } .res-parts { color: #f0c46a; } .res-polymers { color: #7fd8cc; }
.res-electronics { color: #9fb4ff; } .res-fuel { color: #ff9f62; } .res-rare { color: #e2d3ff; } .res-crystals { color: #ff86dd; } .res-rp { color: #c3a2ff; }
.sp-none { color: #aab3bc; } .sp-engineer { color: #ffb35c; } .sp-scientist { color: #c3a2ff; } .sp-botanist { color: #9fdc6a; } .sp-medic { color: #ff8f8f; } .sp-security { color: #8fbcff; } .sp-geologist { color: #e0bd94; }

/* ---------- controls ---------- */
button { font: inherit; color: inherit; min-height: 44px; min-width: 44px; border-radius: var(--r2); border: 1px solid var(--ln); background: var(--s3);
  padding: 0 14px; touch-action: manipulation; cursor: pointer; box-shadow: var(--e1); transition: transform .12s var(--ease), background-color .15s, border-color .15s, filter .15s; }
button:active { transform: translateY(1px) scale(.975); filter: brightness(1.18); }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--frost); outline-offset: 2px; }
button.pri { background: linear-gradient(180deg, #f9bb75, #e48f42); color: var(--amber-ink); border-color: #ffcf98; font-weight: 650; box-shadow: 0 1px 0 rgba(255, 255, 255, .35) inset, 0 4px 14px rgba(228, 143, 66, .25); }
button.danger { color: #ffb8ae; border-color: #7a3a32; background: #2a1613; }
button.on { border-color: var(--amber); color: var(--amber2); background: var(--amberbg); box-shadow: 0 0 0 1px rgba(242, 166, 90, .25) inset; }
button:disabled { opacity: .42; transform: none; filter: none; cursor: default; }
button.icon { padding: 0; width: 44px; display: inline-flex; align-items: center; justify-content: center; } button.icon .ic { width: 22px; height: 22px; }
a.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 44px; padding: 0 14px; border-radius: var(--r2); color: var(--ink2); text-decoration: none; border: 1px solid var(--ln); background: var(--s2); font-size: var(--t-md); }
input[type=text], textarea, select { font: inherit; color: var(--ink); background: var(--s1); border: 1px solid var(--ln2); border-radius: var(--r1);
  padding: 10px 12px; min-height: 44px; width: 100%; -webkit-user-select: text; user-select: text; }
textarea { min-height: 120px; font: 12px/1.3 ui-monospace, Menlo, monospace; resize: vertical; word-break: break-all; }
input[type=range] { width: 100%; min-height: 44px; accent-color: var(--amber); }

/* ---------- HUD: top bar ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#top { position: absolute; top: 0; left: 0; right: 0; padding: calc(var(--sat) + 6px) calc(var(--sar) + 8px) 6px calc(var(--sal) + 8px);
  background: linear-gradient(180deg, rgba(14, 11, 9, .97), rgba(14, 11, 9, .86)); border-bottom: 1px solid rgba(86, 70, 58, .55); box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
#topRow { display: flex; align-items: center; gap: 6px; }
#topRow > button { background: var(--s2); border-color: var(--ln); }
.clock { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; line-height: 1.12; padding: 0 10px; overflow: hidden; }
.clock b { font-size: var(--t-md); font-weight: 700; letter-spacing: .01em; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.clock span { font-size: var(--t-xs); color: var(--ink3); display: flex; align-items: center; gap: 4px; white-space: nowrap; } .clock span .ic { width: 12px; height: 12px; }
.adv { position: relative; color: #ffd98a; }
.adv b { position: absolute; top: 3px; right: 3px; min-width: 17px; height: 17px; border-radius: 9px; font-size: 10.5px; line-height: 17px; background: var(--bad); color: #1a0703; font-weight: 800; padding: 0 4px; font-variant-numeric: tabular-nums; }
.adv b.warn { background: var(--warn); } .adv.pulse { animation: glow 1.6s var(--ease) infinite; }
#speed { display: flex; gap: 0; background: var(--s2); border: 1px solid var(--ln); border-radius: var(--r2); padding: 2px; box-shadow: var(--e1); }
#speed button { width: 44px; min-width: 44px; min-height: 44px; padding: 0; border: 0; background: transparent; box-shadow: none; color: var(--ink3); border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; }
#speed button .ic { width: 18px; height: 18px; }
#speed button.on { background: var(--amberbg); color: var(--amber2); box-shadow: 0 0 0 1px rgba(242, 166, 90, .45) inset; }
#resBar { display: flex; gap: 2px; overflow-x: auto; overflow-y: hidden; margin: 6px -8px 0; padding: 0 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
#resBar::-webkit-scrollbar { display: none; }
.rc { flex: 0 0 auto; display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 4px; align-items: center; min-width: 56px; min-height: 44px; padding: 3px 7px 3px 6px;
  border-radius: var(--r1); background: transparent; border: 1px solid transparent; box-shadow: none; font-size: var(--t-md); line-height: 1.05; }
.rc .ic { grid-row: 1 / 3; width: 18px; height: 18px; }
.rc .v { font-weight: 650; white-space: nowrap; color: var(--ink); } .rc .d { font-size: 10.5px; color: var(--ink3); white-space: nowrap; margin-top: 2px; }
.rc .d.pos { color: var(--good); } .rc .d.neg { color: var(--bad); }
.rc + .rc { position: relative; } .rc + .rc::before { content: ''; position: absolute; left: -1px; top: 10px; bottom: 10px; width: 1px; background: rgba(86, 70, 58, .45); }
.rc.warn { background: var(--warnbg); border-color: rgba(245, 199, 106, .35); } .rc.crit { background: var(--badbg); border-color: rgba(255, 128, 112, .55); animation: glow 1.4s var(--ease) infinite; }
.rc.tick .v { animation: tick .5s var(--ease); }
@keyframes tick { 0% { color: var(--amber2); } 100% { color: var(--ink); } }
@keyframes glow { 50% { filter: brightness(1.35); } }
@keyframes pulse { 50% { filter: brightness(1.4); } }
#hzBar { margin-top: 6px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
#hzBar::-webkit-scrollbar { display: none; }
.hz { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; font-size: var(--t-sm); padding: 4px 11px 4px 8px; border-radius: 999px; background: var(--warnbg); border: 1px solid rgba(245, 199, 106, .4); color: #ffe2a8; white-space: nowrap; min-height: 30px; font-weight: 550; }
.hz .ic { width: 15px; height: 15px; }
.hz.active { background: #3c1a10; border-color: #e8794a; color: #ffd0b4; }
.hz.danger { background: #6e1410; border-color: #ff6a55; color: #fff; cursor: pointer; min-height: 32px; animation: glow 1.6s var(--ease) infinite; }

/* ---------- HUD: bottom tabs ---------- */
#bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: 0; z-index: 6;
  padding: 2px calc(var(--sar) + 2px) calc(var(--sab) + 4px) calc(var(--sal) + 2px); background: linear-gradient(180deg, rgba(14, 11, 9, .9), rgba(14, 11, 9, .99)); border-top: 1px solid rgba(86, 70, 58, .55); }
.tb { flex: 1; min-width: 44px; height: 54px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; background: transparent; border-color: transparent; box-shadow: none; color: var(--ink3); border-radius: var(--r2); }
.tb i { font-style: normal; display: flex; } .tb .ic { width: 23px; height: 23px; stroke-width: 1.7px; }
.tb span { font-size: var(--t-xs); font-weight: 550; letter-spacing: .01em; color: var(--ink3); }
.tb.on { color: var(--amber); background: transparent; border-color: transparent; } .tb.on span { color: var(--amber2); }
.tb.on::before { content: ''; position: absolute; top: -3px; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--amber); }
.pip { position: absolute; top: 6px; right: calc(50% - 17px); width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--s0); }

/* ---------- toasts, guide, placement ---------- */
#toasts { position: absolute; z-index: 9; left: 10px; right: 10px; top: calc(var(--sat) + 104px); display: flex; flex-direction: column; gap: 6px; pointer-events: none; align-items: center; }
.toast { pointer-events: auto; max-width: 100%; background: rgba(24, 19, 15, .97); border: 1px solid var(--ln2); border-radius: var(--r2); padding: 8px 12px 8px 30px; font-size: var(--t-sm); color: var(--ink);
  box-shadow: var(--e2); animation: tin .28s var(--ease); min-height: 36px; position: relative; display: flex; align-items: center; }
.toast::before { content: ''; position: absolute; left: 12px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--frost); }
body.sheet-open .toast { pointer-events: none; opacity: .9; }
body.sheet-open #toasts { top: auto !important; bottom: calc(var(--sab, 0px) + 70px); } /* over a full panel, keep messages off its tabs and header */
.toast.warn::before { background: var(--warn); } .toast.bad::before { background: var(--bad); } .toast.good::before { background: var(--good); }
@keyframes tin { from { transform: translateY(-8px); opacity: 0; } }
#tip { position: absolute; left: 10px; right: 10px; bottom: calc(var(--sab) + 72px); background: linear-gradient(180deg, #2a1f18, #1d1612); border: 1px solid #7a5638; border-radius: var(--r3); padding: 14px 14px 12px; box-shadow: var(--e3); animation: tipin .3s var(--ease); }
@keyframes tipin { from { transform: translateY(12px); opacity: 0; } }
#tip h4 { margin: 0 0 4px; color: var(--amber2); font-size: var(--t-lg); font-weight: 700; } #tip p { margin: 0 0 10px; font-size: var(--t-md); color: var(--ink2); }
#tip .row { display: flex; gap: 8px; justify-content: flex-end; }
#tip .stepn { font-size: var(--t-xs); color: var(--ink3); letter-spacing: .08em; text-transform: uppercase; font-weight: 650; }
.tipbar { height: 3px; border-radius: 2px; background: var(--s4); margin: 2px 0 10px; overflow: hidden; } .tipbar i { display: block; height: 100%; background: var(--amber); border-radius: 2px; }
#placeBar { position: absolute; left: 8px; right: 8px; bottom: calc(var(--sab) + 68px); z-index: 7; background: rgba(24, 19, 15, .98); border: 1px solid var(--ln2); border-radius: var(--r3); padding: 12px; box-shadow: var(--e3); animation: tipin .22s var(--ease); }
#placeBar .t { font-weight: 700; font-size: var(--t-lg); } #placeBar .s { font-size: var(--t-sm); color: var(--ink2); margin: 3px 0 10px; } #placeBar .s.bad { color: var(--bad); }
#placeBar .row { display: flex; gap: 8px; } #placeBar .row button { flex: 1; }

/* ---------- bottom sheet ---------- */
#sheet { position: absolute; left: 0; right: 0; bottom: calc(var(--sab) + 60px); max-height: calc(66% - 40px); display: flex; flex-direction: column; background: var(--s1); border-top: 1px solid var(--ln2);
  border-radius: var(--r4) var(--r4) 0 0; box-shadow: var(--e3); animation: sup .26s var(--ease); z-index: 5; }
#sheet::before { content: ''; position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--ln2); }
#sheet.tall { max-height: calc(100% - var(--sat) - var(--sab) - 60px - 106px); height: calc(100% - var(--sat) - var(--sab) - 60px - 106px); }
@keyframes sup { from { transform: translateY(40px); opacity: .3; } }
.sh-head { display: flex; align-items: center; gap: 10px; padding: 14px 10px 8px 16px; }
.sh-head h3 { flex: 1; margin: 0; font-size: var(--t-xl); font-weight: 750; letter-spacing: .005em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-head .portrait { flex: 0 0 52px; width: 52px; height: 52px; border-radius: var(--r2); background: radial-gradient(120% 90% at 50% 20%, #4a3a2e, #1d1612); border: 1px solid var(--ln2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.sh-head .portrait.big { flex-basis: 64px; width: 64px; height: 64px; }
.sh-head .ttl { flex: 1; min-width: 0; } .sh-head .ttl h3 { display: block; } .sh-head .ttl .kicker { font-size: var(--t-xs); color: var(--ink3); letter-spacing: .1em; text-transform: uppercase; font-weight: 650; }
.sh-body { overflow-y: auto; overflow-x: hidden; padding: 8px 14px 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; border-top: 1px solid var(--ln); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 10px; scrollbar-width: none; flex: 0 0 auto; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 0 0 auto; font-size: var(--t-sm); font-weight: 600; padding: 0 12px; min-height: 44px; border-radius: 999px; background: var(--s2); color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; }
.tabs button .ic { width: 16px; height: 16px; }
.tabs button.on { background: var(--amberbg); color: var(--amber2); border-color: var(--amber); }
.sh-body .tabs { padding: 0 0 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card { background: var(--s2); border: 1px solid var(--ln); border-radius: var(--r2); padding: 12px; position: relative; }
.card.btn { text-align: left; display: block; width: 100%; padding: 10px 10px 10px; min-height: 64px; box-shadow: var(--e1); }
.card.btn:active { background: var(--s3); }
.card.lock { opacity: .6; } .card.sel { border-color: var(--amber); background: var(--amberbg); }
.card h5 { margin: 0 0 3px; font-size: var(--t-md); font-weight: 700; color: var(--ink); } .card p { margin: 3px 0 0; font-size: var(--t-sm); color: var(--ink2); line-height: 1.35; }
.card .art { display: flex; align-items: center; justify-content: center; height: 64px; margin: -6px -6px 8px; border-radius: var(--r1) var(--r1) 4px 4px; background: radial-gradient(70% 70% at 50% 72%, #6a4c38, #2a1f19 70%, #1a1411); overflow: hidden; }
.card.lock .art canvas { filter: grayscale(.8) brightness(.7); }
.card .lockl { display: inline-flex; align-items: center; gap: 4px; color: var(--ink3); } .card .lockl .ic { width: 14px; height: 14px; }
.cost { display: flex; flex-wrap: wrap; gap: 3px 9px; font-size: var(--t-sm); margin-top: 5px; color: var(--ink); } .cost .no, .cost .no .num { color: var(--bad); }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(58, 47, 39, .8); font-size: var(--t-md); }
.kv span:first-child { color: var(--ink3); flex: 0 1 auto; } .kv span:last-child { text-align: right; color: var(--ink); font-weight: 550; }
.row { display: flex; gap: 8px; align-items: center; } .row.wrap { flex-wrap: wrap; } .row > .grow { flex: 1; }
.bar { height: 7px; background: var(--s4); border-radius: 4px; overflow: hidden; margin: 5px 0; } .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #6fc46b, var(--good)); border-radius: 4px; transition: width .4s var(--ease); }
.bar.warn > i { background: linear-gradient(90deg, #d9a443, var(--warn)); } .bar.bad > i { background: linear-gradient(90deg, #d85a4b, var(--bad)); }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-sm); font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--goodbg); color: #c9f2bd; border: 1px solid rgba(143, 220, 138, .3); }
.st::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st.warn { background: var(--warnbg); color: #ffe0a0; border-color: rgba(245, 199, 106, .35); } .st.bad { background: var(--badbg); color: #ffc0b6; border-color: rgba(255, 128, 112, .4); }
.sec { display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; font-size: var(--t-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--ink3); }
.sec::after { content: ''; flex: 1; height: 1px; background: var(--ln); }
.list .it { display: flex; align-items: center; gap: 12px; padding: 9px 4px; border-bottom: 1px solid rgba(58, 47, 39, .8); min-height: 56px; }
.list .it .grow { flex: 1; min-width: 0; } .list .it .sub { font-size: var(--t-sm); color: var(--ink3); }
.list .it.tap { cursor: pointer; border-radius: var(--r1); } .list .it.tap:active { background: var(--s2); }
.avatar { flex: 0 0 36px; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--s3); border: 1px solid var(--ln2); }
.avatar .ic { width: 20px; height: 20px; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 3px; font-size: var(--t-xs); font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--ln2); color: var(--ink2); margin: 1px 3px 1px 0; background: var(--s2); }
.chip.good { border-color: #4f7a45; color: #bdeead; background: var(--goodbg); } .chip.bad { border-color: #8a4036; color: #ffb9ae; background: var(--badbg); }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.slot { border: 1px dashed var(--ln2); border-radius: var(--r2); min-height: 68px; padding: 6px; font-size: var(--t-xs); color: var(--ink2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-align: center; background: var(--s1); box-shadow: none; }
.slot.full { border-style: solid; background: var(--s2); color: var(--ink); } .slot.wip { border-color: var(--warn); } .slot b { font-size: 18px; line-height: 1; }
.seg { display: flex; gap: 0; background: var(--s2); border: 1px solid var(--ln); border-radius: var(--r2); padding: 2px; }
.seg button { flex: 1; padding: 0 6px; font-size: var(--t-sm); font-weight: 600; border: 0; background: transparent; box-shadow: none; color: var(--ink2); border-radius: 9px; min-height: 44px; }
.seg button.on { background: var(--amberbg); color: var(--amber2); box-shadow: 0 0 0 1px rgba(242, 166, 90, .5) inset; }

<script id="engine">
// ===== core.js : namespace, seeded RNG, noise, small helpers =====
'use strict';
var KC = {};
const KC_VERSION = '1.3.1';
const SAVE_FORMAT = 1;
const HOURS_PER_SOL = 24;

function cyrb128(str) {
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0, k; i < str.length; i++) {
    k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
  h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
  h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  h1 ^= (h2 ^ h3 ^ h4); h2 ^= h1; h3 ^= h1; h4 ^= h1;
  return [h1 >>> 0, h2 >>> 0, h3 >>> 0, h4 >>> 0];
}

// sfc32: 4 x uint32 of state, saved with the game so runs replay exactly
class RNG {
  constructor(state) { this.s = new Uint32Array(4); for (let i = 0; i < 4; i++) this.s[i] = state[i] >>> 0; }
  static fromSeed(str) { const r = new RNG(cyrb128(String(str))); for (let i = 0; i < 15; i++) r.next(); return r; }
  next() {
    const s = this.s;
    let a = s[0], b = s[1], c = s[2], d = s[3];
    let t = (a + b) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    d = (d + 1) | 0;
    t = (t + d) | 0;
    c = (c + t) | 0;
    s[0] = a; s[1] = b; s[2] = c; s[3] = d;
    return (t >>> 0) / 4294967296;
  }
  int(n) { return Math.floor(this.next() * n); }
  range(a, b) { return a + this.next() * (b - a); }
  chance(p) { return this.next() < p; }
  pick(a) { return a[this.int(a.length)]; }
  shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = this.int(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  weighted(items, wf) { let tot = 0; for (const it of items) tot += Math.max(0, wf(it)); let r = this.next() * tot; for (const it of items) { r -= Math.max(0, wf(it)); if (r <= 0) return it; } return items[items.length - 1]; }
  state() { return Array.from(this.s); }
}

// seeded 2D value noise with fractal sum
function makeNoise(rng) {
  const P = new Uint8Array(512), V = new Float32Array(256);
  const perm = []; for (let i = 0; i < 256; i++) perm.push(i);
  rng.shuffle(perm);
  for (let i = 0; i < 512; i++) P[i] = perm[i & 255];
  for (let i = 0; i < 256; i++) V[i] = rng.next() * 2 - 1;
  const sm = t => t * t * (3 - 2 * t);
  function n2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const a = V[P[(xi & 255) + P[yi & 255]]], b = V[P[((xi + 1) & 255) + P[yi & 255]]];
    const c = V[P[(xi & 255) + P[(yi + 1) & 255]]], d = V[P[((xi + 1) & 255) + P[(yi + 1) & 255]]];
    const u = sm(xf), v = sm(yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, oct = 4, lac = 2, gain = 0.5) {
    let s = 0, amp = 1, f = 1, norm = 0;
    for (let o = 0; o < oct; o++) { s += amp * n2(x * f, y * f); norm += amp; amp *= gain; f *= lac; }
    return s / norm;
  }
  function ridge(x, y, oct = 4) {
    let s = 0, amp = 1, f = 1, norm = 0;
    for (let o = 0; o < oct; o++) { s += amp * (1 - Math.abs(n2(x * f, y * f))); norm += amp; amp *= 0.5; f *= 2; }
    return s / norm;
  }
  return { n2, fbm, ridge };
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const round1 = v => Math.round(v * 10) / 10;
function cheb(ax, ay, bx, by) { return Math.max(Math.abs(ax - bx), Math.abs(ay - by)); }
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function addTo(obj, k, v) { obj[k] = (obj[k] || 0) + v; }
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
function solOf(tick) { return Math.floor(tick / HOURS_PER_SOL) + 1; }
function hourOf(tick) { return tick % HOURS_PER_SOL; }
function fmtTime(tick) { const h = hourOf(tick); return 'Sol ' + solOf(tick) + ', ' + String(h).padStart(2, '0') + ':00'; }
Object.assign(KC, { RNG, makeNoise, cyrb128, clamp, lerp, cheb, dist, solOf, hourOf, fmtTime, round1, deepClone });

function randomSeedName(r) { r = r || Math.random; return SEED_A[Math.floor(r() * SEED_A.length)] + '-' + SEED_B[Math.floor(r() * SEED_B.length)] + '-' + (100 + Math.floor(r() * 900)); }

// ===== mapgen.js : terrain heightmap, craters, ridges, deposits, anomalies =====
const MAP_N = 64, SECTOR = 8;
const TERR = ['Dust plain', 'Rock field', 'Basalt', 'Frost flat', 'Dunes', 'Highland'];
const SLOPE_BUILD = 0.055, SLOPE_LINE = 0.11, SLOPE_DRIVE = 0.14;

// static terrain is regenerated from the seed on load, never saved
function genTerrain(seed) {
  const n = MAP_N, rng = RNG.fromSeed(seed + '/terrain'), noise = makeNoise(rng), N = n * n;
  const h = new Float32Array(N), terr = new Uint8Array(N), slope = new Float32Array(N), crater = new Float32Array(N);
  const ox = rng.range(0, 100), oy = rng.range(0, 100);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const b = noise.fbm(x / 24 + ox, y / 24 + oy, 5) * 0.55;
    const r = Math.pow(noise.ridge(x / 34 + oy, y / 34 + ox, 3), 3) * 0.55;
    h[y * n + x] = b + r;
  }
  // flatten the centre a little so there is always a landing plain
  const cx = n / 2, cy = n / 2;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const d = Math.hypot(x - cx, y - cy), f = clamp(1 - d / 13, 0, 1);
    const i = y * n + x; h[i] = h[i] * (1 - f * 0.75) + 0.3 * f * 0.75;
  }
  // craters: bowl plus raised rim
  const craters = [], nc = 9 + rng.int(6);
  for (let k = 0; k < nc; k++) {
    const r = k < 2 ? rng.range(7, 11) : rng.range(2.5, 6.5);
    let x, y, tries = 0;
    do { x = rng.range(3, n - 3); y = rng.range(3, n - 3); tries++; } while (Math.hypot(x - cx, y - cy) < r + 7 && tries < 40);
    craters.push({ x, y, r });
    const depth = 0.12 + r * 0.018;
    for (let yy = Math.max(0, Math.floor(y - r * 1.6)); yy < Math.min(n, Math.ceil(y + r * 1.6)); yy++)
      for (let xx = Math.max(0, Math.floor(x - r * 1.6)); xx < Math.min(n, Math.ceil(x + r * 1.6)); xx++) {
        const d = Math.hypot(xx - x, yy - y) / r, i = yy * n + xx;
        if (d < 1) { h[i] -= depth * (1 - d * d) * 0.9; crater[i] = Math.max(crater[i], 1 - d); }
        const rim = Math.exp(-Math.pow((d - 1.05) / 0.18, 2)) * depth * 0.55;
        h[i] += rim;
      }
  }
  let mn = Infinity, mx = -Infinity;
  for (let i = 0; i < N; i++) { mn = Math.min(mn, h[i]); mx = Math.max(mx, h[i]); }
  for (let i = 0; i < N; i++) h[i] = (h[i] - mn) / (mx - mn);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const i = y * n + x; let s = 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= n || yy >= n) continue;
      s = Math.max(s, Math.abs(h[i] - h[yy * n + xx]));
    }
    slope[i] = s;
  }
  const tn = makeNoise(RNG.fromSeed(seed + '/tex'));
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const i = y * n + x, v = tn.fbm(x / 9, y / 9, 3), w = tn.fbm(x / 5 + 40, y / 5 + 40, 2);
    let t = 0;
    if (h[i] > 0.72) t = 5;
    else if (crater[i] > 0.35 && h[i] < 0.38) t = 3;
    else if (slope[i] > 0.05) t = 1;
    else if (v > 0.28) t = 4;
    else if (w < -0.33) t = 2;
    terr[i] = t;
  }
  return { n, h, terr, slope, crater, craters };
}

// deposits, anomalies and the landing site are rolled once and saved with the game
function genFeatures(seed, T) {
  const n = T.n, rng = RNG.fromSeed(seed + '/features');
  const deps = [], anomalies = [];
  const used = new Uint8Array(n * n);
  const flatAt = (x, y, r) => { for (let yy = y - r; yy <= y + r; yy++) for (let xx = x - r; xx <= x + r; xx++) { if (xx < 1 || yy < 1 || xx >= n - 1 || yy >= n - 1) return false; if (T.slope[yy * n + xx] > SLOPE_BUILD) return false; } return true; };
  // landing site: flattest 3x3 near the centre
  let land = null, best = Infinity;
  for (let y = n / 2 - 8; y <= n / 2 + 8; y++) for (let x = n / 2 - 8; x <= n / 2 + 8; x++) {
    if (!flatAt(x, y, 2)) continue;
    const s = Math.hypot(x - n / 2, y - n / 2) + rng.next();
    if (s < best) { best = s; land = { x: x - 1, y: y - 1 }; }
  }
  if (!land) land = { x: n / 2 - 1, y: n / 2 - 1 };
  for (let yy = land.y - 2; yy < land.y + 5; yy++) for (let xx = land.x - 2; xx < land.x + 5; xx++) used[yy * n + xx] = 1;
  const lc = { x: land.x + 1, y: land.y + 1 };
  const place = (type, amt, opt = {}) => {
    for (let tries = 0; tries < 400; tries++) {
      let x, y;
      if (opt.near) { const a = rng.range(0, Math.PI * 2), d = rng.range(opt.near[0], opt.near[1]); x = Math.round(lc.x + Math.cos(a) * d); y = Math.round(lc.y + Math.sin(a) * d); }
      else { x = 2 + rng.int(n - 4); y = 2 + rng.int(n - 4); }
      if (x < 2 || y < 2 || x >= n - 2 || y >= n - 2) continue;
      const i = y * n + x;
      if (used[i]) continue;
      if (!opt.any && T.slope[i] > SLOPE_BUILD) continue;
      if (opt.minD && Math.hypot(x - lc.x, y - lc.y) < opt.minD) continue;
      if (opt.prefer && !opt.prefer(i) && tries < 300) continue;
      const r = opt.r === undefined ? 1 : opt.r;
      for (let yy = y - r - 1; yy <= y + r + 1; yy++) for (let xx = x - r - 1; xx <= x + r + 1; xx++) if (xx >= 0 && yy >= 0 && xx < n && yy < n) used[yy * n + xx] = 1;
      const d = { id: deps.length, type, x, y, r, amount: amt, max: amt, deep: !!opt.deep };
      deps.push(d); return d;
    }
    return null;
  };
  const A = (a, b) => Math.round(rng.range(a, b));
  // guaranteed starters near the lander
  place('regolith', A(3000, 4200), { near: [5, 9], r: 1 }) || place('regolith', A(3000, 4200), { near: [4, 12], r: 1, any: true });
  place('ice', A(2200, 3200), { near: [7, 12], r: 1 }) || place('ice', A(2200, 3200), { near: [5, 14], r: 1, any: true }) || place('ice', A(2200, 3200), { near: [4, 15], r: 0, any: true });
  place('metal', A(1400, 2000), { near: [8, 13], r: 1 });
  place('metal', A(1000, 1600), { near: [10, 16], r: 1 });
  for (let k = 0; k < 7; k++) place('scrap', A(20, 40), { near: [3, 8], r: 0 });
  place('rare', A(500, 800), { near: [11, 16], r: 1 }) || place('rare', A(500, 800), { near: [9, 18], r: 1, any: true });
  // the rest of the region
  for (let k = 0; k < 6; k++) place('regolith', A(2500, 4500), { r: 1 });
  for (let k = 0; k < 7; k++) place('ice', A(1800, 3400), { r: 1, prefer: i => T.crater[i] > 0.2 || T.terr[i] === 3 });
  for (let k = 0; k < 6; k++) place('metal', A(600, 1300), { r: 1 });
  for (let k = 0; k < 4; k++) place('rare', A(250, 600), { r: 1, minD: 10 });
  for (let k = 0; k < 3; k++) place('crystal', A(120, 260), { r: 0, minD: 16 });
  for (let k = 0; k < 4; k++) place('bloom', A(1500, 2500), { r: 1, minD: 8, prefer: i => T.crater[i] > 0.1 });
  for (let k = 0; k < 30; k++) place('scrap', A(15, 45), { r: 0, minD: 6, any: true });
  // deep deposits: hidden until Deep Sounding
  for (let k = 0; k < 5; k++) place('metal', A(1600, 2800), { r: 1, deep: true, minD: 6 });
  for (let k = 0; k < 3; k++) place('rare', A(700, 1200), { r: 1, deep: true, minD: 10 });
  for (let k = 0; k < 3; k++) place('ice', A(2500, 4000), { r: 1, deep: true, minD: 6 });
  // anomalies
  const kinds = Object.keys(ANOMALIES).filter(k => !ANOMALIES[k].story);
  for (let k = 0; k < 13; k++) {
    for (let tries = 0; tries < 200; tries++) {
      const x = 2 + rng.int(n - 4), y = 2 + rng.int(n - 4), i = y * n + x;
      if (used[i] || T.slope[i] > SLOPE_DRIVE * 0.8 || Math.hypot(x - lc.x, y - lc.y) < 7) continue;
      used[i] = 1;
      anomalies.push({ id: k, kind: kinds[k % kinds.length], x, y, done: false, roll: rng.int(1000) });
      break;
    }
  }
  return { deps, anomalies, land };
}

// per-tile deposit index (-1 = none); rebuilt whenever deposits change
function depositGrid(G) {
  const n = MAP_N, g = new Int16Array(n * n).fill(-1);
  for (const d of G.deposits) {
    if (d.amount <= 0 && DEPOSITS[d.type].surface) continue;
    for (let y = d.y - d.r; y <= d.y + d.r; y++) for (let x = d.x - d.r; x <= d.x + d.r; x++) if (x >= 0 && y >= 0 && x < n && y < n) g[y * n + x] = d.id;
  }
  return g;
}

function bestApplicants(G) {
  const want = { engineer: 3, scientist: 2.6, botanist: 3, geologist: 2.2, medic: 1.2, security: 1.2, none: 1.5 }, have = {};

  const sc = a => a.traits.reduce((s, t) => s + (TRAITS[t].good ? 2 : -3), 0) + want[a.spec] / (1 + (have[a.spec] || 0) / 6) - (a.age > 50 ? 1.5 : 0);
  return G.applicants.slice().sort((a, b) => sc(b) - sc(a)).slice(0, KC.arkSize(G));

function drawHistory(cv, G) {
  const c = cv.getContext('2d'), W = cv.width, H = cv.height, hs = G.hist;

  c.strokeStyle = '#3a2d25'; c.lineWidth = 1; for (let k = 1; k < 4; k++) { c.beginPath(); c.moveTo(0, H * k / 4); c.lineTo(W, H * k / 4); c.stroke(); }
  if (hs.length < 2) { c.fillStyle = '#b8a597'; c.font = '24px sans-serif'; c.fillText('History appears after the first sols.', 20, H / 2); return; }
  const series = [[h2 => h2.pop, '#8fdc8a'], [h2 => h2.rp, '#b48cff'], [h2 => h2.funds, '#f6e27a']];
  for (const [f, col] of series) {
    const mx = Math.max(1, ...hs.map(f));
    c.strokeStyle = col; c.lineWidth = 3; c.beginPath();
    hs.forEach((x, i) => { const px = i / (hs.length - 1) * (W - 10) + 5, py = H - 8 - f(x) / mx * (H - 20); if (i) c.lineTo(px, py); else c.moveTo(px, py); });
    c.stroke();
  }
  c.fillStyle = '#8fdc8a'; c.font = 'bold 22px sans-serif'; c.fillText('peak ' + Math.max(...hs.map(x => x.pop)) + ' colonists', 12, 26);
}

    while (x < W + 10) { const run = rr.range(14, 46); if (rr.chance(0.3)) { const up = rr.range(amp, amp * 3) * (rr.chance(0.5) ? -1 : 1); x += rr.range(3, 7); y = clamp(y + up, y0 - amp * 4, y0 + amp * 2); c.lineTo(x, y); } x += run; c.lineTo(x, y + rr.range(-0.6, 0.6)); }
    c.lineTo(W, H); c.fill(); };
  mesa(H * 0.6, '#5e2c1e', 'm1', 5); mesa(H * 0.7, '#45211a', 'm2', 4); mesa(H * 0.82, '#2c1611', 'm3', 2.5);
  // rim light on the far mesa from the star
  c.globalCompositeOperation = 'lighter'; const rl = c.createRadialGradient(sx, sy, 10, sx, sy, 180); rl.addColorStop(0, 'rgba(255,140,70,.22)'); rl.addColorStop(1, 'rgba(255,140,70,0)'); c.fillStyle = rl; c.fillRect(0, H * 0.4, W, H * 0.35); c.globalCompositeOperation = 'source-over';
  // the settlement: two domes, a tube, the lander, a mast with a beacon
  const gy = H * 0.9;
  const dome = (x, rx, ry) => { const dg = c.createRadialGradient(x - rx * 0.3, gy - ry * 0.7, 3, x, gy - ry * 0.3, rx * 1.2); dg.addColorStop(0, 'rgba(255,245,230,.75)'); dg.addColorStop(0.45, 'rgba(150,210,235,.35)'); dg.addColorStop(1, 'rgba(70,120,150,.55)');
    c.fillStyle = dg; c.beginPath(); c.ellipse(x, gy, rx, ry, 0, Math.PI, 0); c.fill(); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1; c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.14)'; for (let k = 1; k < 4; k++) { c.beginPath(); c.ellipse(x, gy, rx * k / 4, ry, 0, Math.PI, 0); c.stroke(); }
    c.fillStyle = 'rgba(255,205,130,.9)'; for (let k = 0; k < 5; k++) c.fillRect(x - rx * 0.6 + k * rx * 0.3, gy - 6 - (k % 2) * 5, 3.5, 2.5); };
  dome(W * 0.3, 50, 42); dome(W * 0.52, 30, 25);
  c.fillStyle = '#3a2a22'; c.fillRect(W * 0.3 + 48, gy - 6, W * 0.52 - W * 0.3 - 76, 5);
  c.fillStyle = '#1c110d'; c.fillRect(W * 0.66, gy - 34, 4, 34); c.fillRect(W * 0.66 - 6, gy - 16, 16, 2);
  c.fillStyle = '#ff5a3a'; c.beginPath(); c.arc(W * 0.66 + 2, gy - 37, 2.4, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,90,58,.25)'; c.beginPath(); c.arc(W * 0.66 + 2, gy - 37, 7, 0, 7); c.fill();
  // the ground with a cold frost sheen
  const fg = c.createLinearGradient(0, gy - 4, 0, H); fg.addColorStop(0, '#26140f'); fg.addColorStop(1, '#130b08'); c.fillStyle = fg; c.fillRect(0, gy - 1, W, H - gy + 1);
  c.fillStyle = 'rgba(170,210,235,.16)'; for (let k = 0; k < 40; k++) c.fillRect(r.next() * W, gy + 2 + r.next() * (H - gy - 4), r.range(6, 22), 1);
  // dust haze
  const hz = c.createLinearGradient(0, H * 0.5, 0, H); hz.addColorStop(0, 'rgba(210,130,80,0)'); hz.addColorStop(1, 'rgba(210,130,80,.14)'); c.fillStyle = hz; c.fillRect(0, 0, W, H);
}

// ===== tips.js : the guided first colony: steps driven by colony state, with a pointer to what to tap next =====
const tipLander = G => G.buildings.find(b => b.t === 'lander');
const tipDome = G => G.buildings.find(b => !b.mod && BUILDINGS[b.t].dome);
// the next thing to tap on the way to building `type` from category `cat`
function buildPath(cat, type) {
  if (UI.mode && UI.mode.k === 'build') return UI.mode.type === type ? '#placeBar button.pri' : '#placeBar button';
  const sh = !$('#sheet').hidden && Sheet.cur;
  if (sh && Sheet.cur.tab === 'build') return Panels._buildCat === cat ? '[data-build=' + type + ']' : '#sheet .tabs button[data-k=' + cat + ']';
  if (sh) return '#sheet .sh-head button[aria-label=Close]';
  return '[data-tab=build]';
}
const tipHas = (G, t, n) => G.buildings.filter(b => b.t === t).length >= (n || 1);
const TIPS = [
  { id: 'welcome', title: 'Welcome to Kessa', text: 'Your lander is down on a cold, thin-aired world. Drag to look around, pinch to zoom, tap anything to inspect it. Time runs at the top: pause or speed it up whenever you like. The advisor (the bulb at the top) always lists problems and what to build next.', done: () => false, manual: true },
  { id: 'drones', title: 'Drones do the building', text: 'You never build by hand: drones do. The lander carries 4 and they work only inside its range. Open Layers → Drone coverage (or tap the lander) to see where they can reach. Later, Drone Hubs and the Drone Crawler reach further.',
    done: G => (R.sel && R.sel.k === 'b' && R.sel.id === tipLander(G).id) || R.overlay === 'drones', hl: () => $('#sheet').hidden ? '[data-tab=layers]' : $('[data-layer=drones]') ? '[data-layer=drones]' : '#sheet .sh-head button[aria-label=Close]',
    show: G => { const L = tipLander(G); R.centerOn(L.x + 1.5, L.y + 1.5); R.overlay = 'drones'; R.sel = { k: 'b', id: L.id }; Panels.building(L); } },
  { id: 'solar', title: 'Power first', text: 'Place two Solar Arrays touching the lander (Build → Power). Buildings that touch share power; ones further away get cable planned for them.', done: G => tipHas(G, 'solar', 2), hl: () => buildPath('power', 'solar'), show: () => UI.beginBuild('solar') },
  { id: 'battery', title: 'Survive the night', text: 'Nights last about 11 hours and solar makes nothing then. Each Battery Bank stores 60 power. Build two now; the advisor tells you when you need more.', done: G => tipHas(G, 'battery', 2), hl: () => buildPath('power', 'battery'), show: () => UI.beginBuild('battery') },
  { id: 'sinter', title: 'Building blocks', text: 'Domes need sinter. Place a Regolith Sinterer (Build → Industry) on the tan fine-regolith deposit; Show me finds the nearest. Drones collect the grey metal scatter on their own.', done: G => tipHas(G, 'sinterer'), hl: () => buildPath('industry', 'sinterer'), show: () => UI.beginBuild('sinterer') },
  { id: 'water', title: 'Water and air', text: 'People need both. Your prefabs are free: an Ice Drill on the pale blue ice deposit, and an Air Synthesizer by the base (Build → Life support). A far drill gets cable and pipe planned automatically.',
    done: G => tipHas(G, 'icedrill') && tipHas(G, 'airsynth'), hl: G => buildPath('life', tipHas(G, 'icedrill') ? 'airsynth' : 'icedrill'), show: G => UI.beginBuild(tipHas(G, 'icedrill') ? 'airsynth' : 'icedrill') },
  { id: 'tanks', title: 'A buffer', text: 'Add a Water Tank and an Air Tank touching your network. If a machine breaks, the tanks keep everyone breathing while drones repair it.',
    done: G => tipHas(G, 'watertank') && tipHas(G, 'airtank'), hl: G => buildPath('life', tipHas(G, 'watertank') ? 'airtank' : 'watertank'), show: G => UI.beginBuild(tipHas(G, 'watertank') ? 'airtank' : 'watertank') },
  { id: 'dome', title: 'A home under glass', text: 'Place a Bubble Dome (Build → Domes) touching the base, so it shares power and pipes. It is the biggest job yet: watch the drones work on it.', done: G => !!tipDome(G), hl: () => buildPath('domes', 'dome_s'), show: () => UI.beginBuild('dome_s') },
  { id: 'modules', title: 'Fill the dome', text: G => { const d = tipDome(G); return (d && !d.built ? 'The dome is ' + Math.round(100 * d.prog / BUILDINGS[d.t].work) + '% built: drones are on it (speed up time if you like). ' : '') + 'Domes are empty shells. Once it is finished, tap it and add Living Quarters (beds), a Canteen (food service) and Hydroponics (food). Modules build inside, so they need no space outside.'; },
    done: G => tipHas(G, 'quarters') && tipHas(G, 'hydro'),
    hl: G => { const d = tipDome(G); if (!d || !d.built) return null; const sh = !$('#sheet').hidden && Sheet.cur; if (sh && $('[data-mod]')) return '[data-mod=' + (tipHas(G, 'quarters') ? (tipHas(G, 'canteen') ? 'hydro' : 'canteen') : 'quarters') + ']'; if (sh && $('#sheet button.pri.grow')) return '#sheet button.pri.grow'; return null; },
    show: G => { const d = tipDome(G); if (!d) return; R.centerOn(d.x + d.s / 2, d.y + d.s / 2); R.sel = { k: 'b', id: d.id }; if (d.built) Panels.addModule(d); else { Panels.building(d); HUD.toast('The dome is still being built. Add modules when it is done.', 'warn'); } } },
  { id: 'research', title: 'Research', text: 'Open Research and pick a technology. Until you have labs and scientists it is slow, but it never stops.', done: G => !!G.research.cur || G.research.queue.length > 0, hl: () => $('#sheet').hidden ? '[data-tab=research]' : !Sheet.cur || Sheet.cur.tab !== 'research' ? '#sheet .sh-head button[aria-label=Close]' : '[data-tech]:not(.done)', show: () => Panels.research() },
  { id: 'ark', title: 'Bring people', text: 'Once the dome has beds, power, water and oxygen, open Rockets → Ark, tap Pick best, add some food in Cargo, and Launch. If something is missing, the rocket panel says what.',
    done: G => G.st.everColonists || G.rockets.some(r => r.ark.length), hl: () => $('#sheet').hidden ? '[data-tab=rockets]' : !Sheet.cur || Sheet.cur.tab !== 'rockets' ? '#sheet .sh-head button[aria-label=Close]' : $('#sheet button:not(.on)[data-k=ark]') ? '#sheet .tabs button[data-k=ark]' : UI.order && !UI.order.ark.size && $('[data-pick]') ? '[data-pick]' : '[data-launch]', show: () => Panels.rockets('ark') },
  { id: 'jobs', title: 'Work and homes', text: 'Colonists take jobs near their dome. Build a Machine Works and an Ore Extractor so you make your own parts and metals. In People you can see who is unemployed, homeless or unhappy, and fix it with one tap.', done: G => tipHas(G, 'works'), hl: () => buildPath('industry', 'works'), show: () => UI.beginBuild('works') },
  { id: 'goal', title: 'The long game', text: 'Open Goals to see what Independence needs. Expand with more domes, labs and industry, sell your surplus, and watch the hazard warnings. Good luck, Commander.', done: () => false, manual: true },
];
const Tips = {
  reset() { this.shown = null; this.check(); },
  hl(sel) {
    const el = sel ? $(sel) : null;
    if (this._hl && this._hl !== el) this._hl.classList.remove('guide-hl');
    if (el && el.offsetParent !== null) { el.classList.add('guide-hl'); this._hl = el; } else this._hl = null;
  },
  check() {
    const G = UI.G, el = $('#tip');
    if (!G || !Settings.get('tips') || G.over) { el.hidden = true; this.hl(null); return; }
    const doneList = Settings.get('tipsDone') || [];
    for (const t of TIPS) if (!doneList.includes(t.id) && t.done(G)) { doneList.push(t.id); Settings.set('tipsDone', doneList); if (t.id !== 'welcome') Sound.play('good'); }
    const next = TIPS.find(t => !doneList.includes(t.id));
    Settings.data.tipsDone = doneList;
    let sel = null; try { sel = next && next.hl ? next.hl(G) : null; } catch (e) { sel = null; }
    // still placing something the current step does not need: point at Done
    if (UI.mode && (!sel || !/placeBar/.test(sel))) sel = '#placeBar button';
    this.hl(Modal.open ? null : sel);
    if (!next || UI.mode || !$('#sheet').hidden || Modal.open || $('#screens').children.length) { el.hidden = true; this.shown = null; return; }
    const text = typeof next.text === 'function' ? next.text(G) : next.text;
    if (this.shown === next.id && this._text === text && !el.hidden) return;
    this.shown = next.id; this._text = text; el.hidden = false; el.innerHTML = '';
    const n = TIPS.indexOf(next) + 1;
    el.appendChild(h('div', { class: 'row', style: 'justify-content:space-between' }, h('h4', null, next.title), h('span', { class: 'small mut' }, 'Step ' + n + ' of ' + TIPS.length)));
    el.appendChild(h('p', null, text));
    el.appendChild(h('div', { class: 'row' },
      h('button', { onclick: () => Modal.confirm('End the guide?', 'You can turn it back on in Settings → Tutorial tips.', () => { Settings.set('tips', false); el.hidden = true; this.hl(null); }, 'End guide') }, 'End guide'),
      next.manual ? null : h('button', { onclick: () => { doneList.push(next.id); Settings.set('tipsDone', doneList); this.shown = null; Sound.play('tap'); this.check(); } }, 'Skip'),
      next.show ? h('button', { class: 'pri', 'data-show': next.id, onclick: () => { Sound.play('open'); el.hidden = true; this.shown = null; next.show(G); } }, 'Show me') : h('button', { class: 'pri', onclick: () => { doneList.push(next.id); Settings.set('tipsDone', doneList); this.shown = null; Sound.play('tap'); this.check(); } }, next.manual ? 'Got it' : 'Next')));
  },
};

// ===== main.js : boot and wiring of HUD buttons =====
(function boot() {
  R.init($('#map'));
  // drawn icons for the static HUD buttons
  const put = (sel, name) => { const el = $(sel); if (el) { el.textContent = ''; el.appendChild(ic(name)); } };
  put('#btnMenu', 'menu');
  { const a = $('#btnAdvice'), n = $('#advN'); a.textContent = ''; a.appendChild(ic('advisor')); a.appendChild(n); }
  for (const [sp, name] of [['0', 'pause'], ['1', 'play'], ['3', 'fast'], ['10', 'fastest']]) put('#speed [data-sp="' + sp + '"]', name);
  $$('#bottom .tb').forEach(b => { const i = $('i', b); i.textContent = ''; i.appendChild(ic(b.dataset.tab)); });
  UI.input = attachInput($('#map'), { tap: (x, y) => UI.tap(x, y) });
  $$('#speed button').forEach(b => b.addEventListener('click', () => { Sound.unlock(); UI.setSpeed(+b.dataset.sp); Sound.play('tap'); }));
  $('#btnMenu').addEventListener('click', () => { Sound.unlock(); Panels.gameMenu(); });
  $('#btnAdvice').addEventListener('click', () => { Sound.unlock(); Sound.play('open'); if (UI.mode) UI.cancelMode(); if (UI.G && UI.G.event) Screens.event(); else Panels.advice(); });
  $('#clock').addEventListener('click', () => { Sound.unlock(); UI.togglePause(); });
  const tabs = { build: () => Panels.build(), layers: () => Panels.layers(), people: () => Panels.people(), research: () => Panels.research(), rockets: () => Panels.rockets(), log: () => Panels.log(), goals: () => Panels.goals() };
  $$('#bottom .tb').forEach(b => b.addEventListener('click', () => {
    Sound.unlock(); Sound.play('open');
    if (UI.mode) UI.cancelMode();
    if (Sheet.cur && Sheet.cur.tab === b.dataset.tab) { Sheet.close(); return; }
    tabs[b.dataset.tab]();
  }));
  document.addEventListener('keydown', e => {
    if (!UI.G || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === ' ') { e.preventDefault(); UI.togglePause(); }
    else if (e.key === 'Escape') { if (UI.mode) UI.cancelMode(); else Sheet.close(); }
    else if (e.key === '1' || e.key === '2' || e.key === '3') UI.setSpeed([1, 3, 10][+e.key - 1]);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && UI.G && Settings.get('autosave')) Saves.write('auto', UI.G); });
  window.addEventListener('pagehide', () => { if (UI.G && Settings.get('autosave')) Saves.write('auto', UI.G); });
  document.addEventListener('pointerdown', () => Sound.unlock(), { once: true });
  Screens.main();
  requestAnimationFrame(t => UI.loop(t));
})();

</script>
